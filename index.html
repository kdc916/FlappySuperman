      position: fixed;
      visibility: hidden;
      pointer-events: none;

    }
  </style>

<body>
<div id="safe"></div>
<canvas id="gameCanvas"></canvas>

<script>
(() => {
'use strict';

/* =========================================================================
   1. 가상 해상도
   -------------------------------------------------------------------------
   모든 게임 로직은 "유닛" 좌표로 계산한다. 플레이 영역 높이는 어떤 기기에서도
   560유닛으로 동일하고, 화면 크기에 따라 배율(scale)만 달라진다.
   세로로 아주 긴 화면은 남는 공간을 땅으로 채우고, 가로로 넓은 화면은
   더 멀리 보일 뿐 장애물 간격·속도·판정은 완전히 같다.
   ========================================================================= */
const PLAY_H = 560;        // 하늘(플레이 영역) 높이
const MIN_GROUND = 80;     // 땅 최소 높이
const MIN_H = PLAY_H + MIN_GROUND;
const MIN_W = 300;         // 보장되는 최소 가로 유닛
const INK = '#1b1530';     // 외곽선 색
const FONT = '"Press Start 2P", ui-monospace, Menlo, Consolas, monospace';

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const safeEl = document.getElementById('safe');

// 성능 자동 조절: 프레임이 계속 밀리면 렌더 해상도를 단계적으로 낮추고, 마지막엔 빛 효과를 끈다
const DPR_CAPS = [3, 2, 1.5, 1, 1];
let quality = 0, fxRays = true, slowMs = STEP_GUESS(), slowN = 0;
function STEP_GUESS() { return 16.7; }
let cssW = 1, cssH = 1, dpr = 1, scale = 1, S = 1;
let VW = MIN_W, VH = MIN_H, groundH = MIN_GROUND, heroX = 90, ui = 1;
const safe = { t: 0, r: 0, b: 0, l: 0 };

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

function resize() {
  cssW = Math.max(1, window.innerWidth);
  cssH = Math.max(1, window.innerHeight);
  dpr = clamp(window.devicePixelRatio || 1, 1, DPR_CAPS[quality]);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);

  scale = Math.min(cssH / MIN_H, cssW / MIN_W);
  S = scale * dpr;
  VW = cssW / scale;
  VH = cssH / scale;
  groundH = VH - PLAY_H;

  const cs = getComputedStyle(safeEl);
  safe.t = (parseFloat(cs.paddingTop) || 0) / scale;
  safe.r = (parseFloat(cs.paddingRight) || 0) / scale;
  safe.b = (parseFloat(cs.paddingBottom) || 0) / scale;
  safe.l = (parseFloat(cs.paddingLeft) || 0) / scale;

  heroX = clamp(VW * 0.26, 84, 230) + safe.l;
  // 화면이 아주 작을 때(가로 모드 폰 등) 글자가 읽히도록 UI만 키운다
  ui = clamp(0.8 / scale, 1, 1.5);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

/* =========================================================================
   2. 사운드
   ========================================================================= */
let audioCtx = null, master = null, muted = false;
try { muted = localStorage.getItem('flappy_hero_muted') === '1'; } catch (e) {}

function initAudio() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      master = audioCtx.createGain();
      master.gain.value = muted ? 0 : 0.6;
      master.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
function setMuted(m) {
  muted = m;
  if (master) master.gain.value = muted ? 0 : 0.6;
  try { localStorage.setItem('flappy_hero_muted', muted ? '1' : '0'); } catch (e) {}
}
function tone(type, f0, f1, dur, vol, delay) {
  if (!audioCtx || muted) return;
  try {
    const t = audioCtx.currentTime + (delay || 0);
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function noise(dur, vol, f0, f1) {
  if (!audioCtx || muted) return;
  try {
    const n = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const f = audioCtx.createBiquadFilter();
    f.type = 'lowpass';
    const t = audioCtx.currentTime;
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t);
  } catch (e) {}
}
const sfx = {
  flap()  { tone('triangle', 300, 660, 0.11, 0.28); },
  score() { tone('square', 988, 988, 0.07, 0.12); tone('square', 1319, 1319, 0.16, 0.12, 0.07); },
  hit()   { noise(0.28, 0.5, 900, 60); tone('square', 160, 50, 0.2, 0.2); },
  fall()  { tone('sine', 720, 180, 0.38, 0.16, 0.08); },
  thud()  { noise(0.16, 0.4, 400, 50); },
  best()  { [523, 659, 784, 1047].forEach((f, i) => tone('square', f, f, 0.14, 0.12, 0.35 + i * 0.09)); },
  phase() { tone('triangle', 660, 990, 0.25, 0.1); }
};

/* =========================================================================
   3. 도트 아트 에셋 (전부 코드로 미리 그려 둔다)
   ========================================================================= */
function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return [c, g];
}

/* --- 주인공: 헬멧과 고글을 쓴 오리지널 히어로 (20x10 도트) --- */
const HERO_ROWS = [
  '..............KKKK..',
  '.............KHHHHK.',
  '............KHHVGVVK',
  '............KhHFFFFK',
  '...KKKKKKKKKKDFFFFK.',
  '.KKBBSSSSSSSSSSKKKKK',
  'KBBBSSSSWWSSSSSSSOOK',
  'KBBBDSSSSSSDDDKKKKK.',
  '.KKBDDDDDDDKKK......',
  '...KKKKKKKK.........'
];
const HERO_PAL = {
  K: INK, H: '#f6f3ea', h: '#cfc9bd', V: '#2b2d5b', G: '#8fe9ff', F: '#ffcf9f',
  S: '#19b5a5', D: '#0e7f78', B: '#ff8a2a', O: '#ff8a2a', W: '#fff4b8'
};
const HERO_PX = 2;                          // 도트 1칸 = 2유닛
const HERO_W = HERO_ROWS[0].length * HERO_PX;
const HERO_H = HERO_ROWS.length * HERO_PX;
function buildSprite(rows, pal, solid) {
  const [c, g] = makeCanvas(rows[0].length, rows.length);
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const ch = row[x];
      if (ch === '.') continue;
      g.fillStyle = solid || pal[ch];
      g.fillRect(x, y, 1, 1);
    }
  });
  return c;
}
const heroSprite = buildSprite(HERO_ROWS, HERO_PAL);
const heroGhost = buildSprite(HERO_ROWS, HERO_PAL, '#bff4ff');

/* --- 시간대 팔레트: 낮 → 노을 → 밤 --- */
const PALS = [
  { // 낮
    sky: ['#3f8fd8', '#4f9fe0', '#62aee6', '#78bdea', '#92cbee', '#aed9f1', '#c8e6f4', '#dff0f6'],
    cloud: '#ffffff', cloudSh: '#d3e6f5',
    far: '#9cc6e0', farSh: '#89b6d3', farOn: '#c3e0f0', farOff: '#b0d2e6',
    near: '#6f9fc6', nearSh: '#5c8bb3', nearOn: '#b8d9ee', nearOff: '#8fb9d9',
    bush: '#5fae3a', bushHi: '#86cf52', tint: null, stars: 0
  },
  { // 노을
    sky: ['#3b2a6b', '#5a3580', '#874089', '#b84d85', '#e06a75', '#f48d68', '#fbb565', '#fdd98a'],
    cloud: '#ffd9c7', cloudSh: '#f3a0a0',
    far: '#b0608a', farSh: '#9a4f7c', farOn: '#ffd28a', farOff: '#c57a95',
    near: '#5e2f66', nearSh: '#4a2355', nearOn: '#ffd27a', nearOff: '#7a4379',
    bush: '#4f7a3a', bushHi: '#8aa34c', tint: 'rgba(255,110,50,0.16)', stars: 0.25
  },
  { // 밤
    sky: ['#070b24', '#0b1233', '#101a44', '#162354', '#1d2d63', '#243872', '#2c4380', '#35508d'],
    cloud: '#5b6baa', cloudSh: '#45528d',
    far: '#22306a', farSh: '#1b2759', farOn: '#ffe38a', farOff: '#2c3c7c',
    near: '#111a42', nearSh: '#0c1335', nearOn: '#ffd866', nearOff: '#1b2757',
    bush: '#1f4a3c', bushHi: '#2f6a4c', tint: 'rgba(8,14,62,0.42)', stars: 1
  }
];
const PHASE_SEQ = [0, 1, 2, 1];   // 10점마다 낮→노을→밤→새벽→낮…

/* --- 스카이라인 (1도트 = 2유닛, 반복 타일) --- */
function genSkyline(seed, LW, minW, maxW, minH, maxH) {
  const r = mulberry(seed), list = [];
  let x = 0;
  while (x < LW) {
    let w = minW + Math.floor(r() * (maxW - minW + 1));
    if (LW - x - w < minW) w = LW - x;
    const h = minH + Math.floor(r() * (maxH - minH + 1));
    const roof = r();
    const wins = [];
    for (let wy = 4; wy < h - 4; wy += 5)
      for (let wx = 2; wx <= w - 5; wx += 4) wins.push([wx, wy, r() < 0.42]);
    list.push({ x, w, h, roof, wins });
    x += w;
  }
  return list;
}
function renderSkyline(list, LW, LH, body, shade, on, off) {
  const [c, g] = makeCanvas(LW, LH);
  for (const b of list) {
    const top = LH - b.h;
    g.fillStyle = body;
    g.fillRect(b.x, top, b.w - 1, b.h);
    g.fillStyle = shade;
    g.fillRect(b.x + b.w - 3, top, 2, b.h);
    if (b.roof < 0.3) {                         // 안테나
      g.fillStyle = shade;
      g.fillRect(b.x + (b.w >> 1), top - 8, 1, 8);
      g.fillRect(b.x + (b.w >> 1) - 1, top - 2, 3, 2);
    } else if (b.roof < 0.6) {                  // 계단식 옥상
      g.fillStyle = body;
      g.fillRect(b.x + 3, top - 4, b.w - 7, 4);
      g.fillStyle = shade;
      g.fillRect(b.x + b.w - 6, top - 4, 2, 4);
    } else if (b.roof < 0.78) {                 // 물탱크
      g.fillStyle = shade;
      g.fillRect(b.x + 3, top - 5, 5, 4);
      g.fillRect(b.x + 4, top - 1, 1, 1);
      g.fillRect(b.x + 6, top - 1, 1, 1);
    }
    for (const [wx, wy, lit] of b.wins) {
      g.fillStyle = lit ? on : off;
      g.fillRect(b.x + wx, top + wy, 2, 3);
    }
  }
  return c;
}
const FAR_W = 360, FAR_H = 150, NEAR_W = 450, NEAR_H = 110;
const farList = genSkyline(11, FAR_W, 16, 26, 60, 132);
const nearList = genSkyline(29, NEAR_W, 18, 32, 34, 92);

/* --- 덤불 --- */
const BUSH_W = 256, BUSH_H = 18;
function renderBushes(col, hi) {
  const [c, g] = makeCanvas(BUSH_W, BUSH_H);
  const r = mulberry(77);
  const disc = (cx, cy, rad, color) => {
    g.fillStyle = color;
    for (let y = -rad; y <= rad; y++) {
      const hw = Math.floor(Math.sqrt(rad * rad - y * y));
      g.fillRect(cx - hw, cy + y, hw * 2 + 1, 1);
    }
  };
  let x = 0;
  const blobs = [];
  while (x < BUSH_W) {
    const rad = 5 + Math.floor(r() * 6);
    blobs.push([x, rad]);
    x += rad + 2 + Math.floor(r() * 4);
  }
  for (const [bx, rad] of blobs) for (const o of [0, BUSH_W, -BUSH_W]) disc(bx + o, BUSH_H, rad, col);
  for (const [bx, rad] of blobs) for (const o of [0, BUSH_W, -BUSH_W]) disc(bx + o - 1, BUSH_H - rad + 2, Math.max(1, rad - 4), hi);
  return c;
}

for (const p of PALS) {
  p.farImg = renderSkyline(farList, FAR_W, FAR_H, p.far, p.farSh, p.farOn, p.farOff);
  p.nearImg = renderSkyline(nearList, NEAR_W, NEAR_H, p.near, p.nearSh, p.nearOn, p.nearOff);
  p.bushImg = renderBushes(p.bush, p.bushHi);
}

/* --- 흙 타일 --- */
const DIRT_W = 64, DIRT_H = 32;
const dirtImg = (() => {
  const [c, g] = makeCanvas(DIRT_W, DIRT_H);
  g.fillStyle = '#dcc07a';
  g.fillRect(0, 0, DIRT_W, DIRT_H);
  const r = mulberry(5);
  for (let i = 0; i < 46; i++) {
    g.fillStyle = r() < 0.6 ? '#c9a65e' : '#ead596';
    g.fillRect(Math.floor(r() * DIRT_W), Math.floor(r() * DIRT_H), r() < 0.3 ? 2 : 1, 1);
  }
  g.fillStyle = '#b98f4a';
  for (let i = 0; i < 7; i++) {
    const x = Math.floor(r() * (DIRT_W - 3)), y = Math.floor(r() * (DIRT_H - 2));
    g.fillRect(x, y, 2, 1); g.fillRect(x, y + 1, 1, 1);
  }
  return c;
})();

/* --- 별 --- */
const STARS = (() => {
  const r = mulberry(404), a = [];
  for (let i = 0; i < 70; i++) a.push({ fx: r(), fy: r() * 0.62, big: r() < 0.18, ph: r() * 6.28 });
  return a;
})();

/* --- 구름 --- */
const CLOUDS = (() => {
  const r = mulberry(8), a = [];
  for (let i = 0; i < 7; i++) a.push({ fx: (i + r() * 0.6) / 7, y: 40 + r() * 230, k: r() < 0.4 ? 1.5 : 1, sp: 0.1 + r() * 0.12 });
  return a;
})();

/* --- 사실적인 볼류메트릭 라이트 ---
   화면 공간 광산란(screen-space light scattering) 방식:
   1) 저해상도 버퍼에 광원의 빛을 그리고, 빛을 가리는 것(기둥·건물·주인공)을 지운다.
   2) 그 버퍼를 광원 중심으로 여러 번 확대하며 겹쳐 방사형 블러를 만든다.
   3) 결과를 화면에 가산 합성한다. → 가려진 틈으로 부드러운 빛기둥이 새어 나온다. */
const GR = 4;                                  // 빛 버퍼 1픽셀 = 4유닛
const [occCv, occCtx] = makeCanvas(2, 2);
const [blurCv, blurCtx] = makeCanvas(2, 2);
const [rayCv, rayCtx] = makeCanvas(2, 2);
const LIGHTS = [
  { core: '255,255,238', rgb: '255,232,160', k: 0.52, r: 26, halo: 300, refl: 0.22 },   // 낮의 해
  { core: '255,246,214', rgb: '255,164,78',  k: 0.72, r: 46, halo: 400, refl: 0.6 },    // 노을
  { core: '236,243,255', rgb: '146,182,255', k: 0.6,  r: 24, halo: 260, refl: 0.35 }     // 달
];
function lightPos(idx) {
  if (idx === 0) return { x: Math.round(VW * 0.8), y: 236 + safe.t };
  if (idx === 1) return { x: Math.round(VW * 0.68), y: PLAY_H - 150 };
  return { x: Math.round(VW * 0.78), y: 108 + safe.t };
}

/* =========================================================================
   4. 밸런스
   -------------------------------------------------------------------------
   60Hz 고정 스텝. 주사율(60/90/120/144Hz)과 무관하게 같은 속도로 진행된다.
   ========================================================================= */
const STEP_MS = 1000 / 60;
const GRAVITY = 0.27;
const FLAP_V = -5.7;         // 점프 높이 약 60유닛
const MAX_FALL = 9.5;
const PIPE_W = 62;
const CAP_H = 26, CAP_OVER = 4;
const HIT_HW = 13, HIT_HH = 8;   // 캐릭터 판정 (보이는 것보다 약간 작게)
const FIRST_PIPE = 400;          // 시작 후 첫 장애물까지 거리 (어느 화면이든 동일)
const PIPE_MARGIN = 54;          // 틈이 천장/바닥에서 떨어져야 하는 최소 거리
const RETRY_DELAY = 40;          // 게임오버 직후 실수로 재시작되는 것을 막는 프레임

const speedFor = n => 2.35 + 1.0 * Math.min(1, n / 45);          // 2.35 → 3.35
function gapFor(n) {                                             // 182 → 134
  const t = Math.min(1, n / 40);
  return Math.round(182 - 48 * (1 - (1 - t) * (1 - t)));
}
const spacingFor = n => 236 + 34 * Math.min(1, n / 40);          // 236 → 270
const THEMES = {
  green:  { main: '#74c232', hi: '#b6ee62', hi2: '#93d948', sh: '#559a22', dk: '#3c7417' },
  copper: { main: '#d98a3c', hi: '#ffc77d', hi2: '#eda45a', sh: '#b0652a', dk: '#84451b' },
  steel:  { main: '#8a7fd6', hi: '#cfc8ff', hi2: '#a79df0', sh: '#665bb4', dk: '#463d8a' }  // 움직이는 기둥
};

/* =========================================================================
   5. 게임 상태
   ========================================================================= */
let state = 'READY';         // READY | PLAYING | DYING | OVER
let paused = false;
let tick = 0;
let score = 0, shownScore = 0, scorePop = 0;
let best = 0, newBest = false;
try { best = parseInt(localStorage.getItem('flappy_hero_best'), 10) || 0; } catch (e) {}

let dist = 0, prevDist = 0;          // 게임 진행 거리 (판정용)
let scrollX = 0, prevScrollX = 0;    // 배경 스크롤 (연출용)
let pipes = [], pipeIndex = 0, lastWX = 0, lastC = PLAY_H * 0.45;
let overT = 0, shake = 0, flash = 0;
let phaseFrom = 0, phaseTo = 0, phaseBlend = 1, phaseStep = 0;

const hero = { y: PLAY_H * 0.45, prevY: PLAY_H * 0.45, v: 0, rot: 0, prevRot: 0 };
const particles = [], ghosts = [], lines = [];

function resetGame() {
  state = 'READY';
  score = 0; shownScore = 0; scorePop = 0; newBest = false;
  dist = prevDist = 0;
  pipes = []; pipeIndex = 0; lastWX = 0; lastC = PLAY_H * 0.45;
  hero.y = hero.prevY = PLAY_H * 0.45; hero.v = 0; hero.rot = hero.prevRot = 0;
  particles.length = ghosts.length = lines.length = 0;
  overT = 0; shake = 0; flash = 0;
  if (phaseTo !== 0) { phaseFrom = phaseTo; phaseTo = 0; phaseBlend = 0; }
  phaseStep = 0;
}

function spawnPipe() {
  const n = pipeIndex++;
  const gap = gapFor(n);
  const spacing = spacingFor(n);
  const wx = n === 0 ? dist + FIRST_PIPE : lastWX + spacing;
  const moving = n >= 18 && Math.random() < 0.28;
  const amp = moving ? 20 : 0;

  // 이전 틈에서 물리적으로 여유 있게 도달할 수 있는 범위 안에서만 다음 틈을 놓는다
  const travel = (spacing - PIPE_W) / speedFor(n);
  const maxD = n < 3 ? 80 : Math.min(travel * 2.1, 210);
  let lo = PIPE_MARGIN + gap / 2 + amp;
  let hi = PLAY_H - PIPE_MARGIN - gap / 2 - amp;
  lo = Math.max(lo, lastC - maxD);
  hi = Math.min(hi, lastC + maxD);
  const c = lo + Math.random() * Math.max(0, hi - lo);

  pipes.push({
    wx, c, gap, amp, ph: Math.random() * 6.28,
    theme: moving ? 'steel' : (n % 2 ? 'copper' : 'green'),
    passed: false
  });
  lastWX = wx; lastC = c;
}
const pipeCenter = p => p.amp ? p.c + Math.sin(tick * 0.04 + p.ph) * p.amp : p.c;

function flap() {
  hero.v = FLAP_V;
  sfx.flap();
  for (let i = 0; i < 3; i++)
    lines.push({ x: heroX - 14, y: hero.y - 8 + Math.random() * 16, len: 16 + Math.random() * 22, sp: 5 + Math.random() * 5, a: 0.7 });
  for (let i = 0; i < 5; i++)
    particles.push({
      x: heroX - 18, y: hero.y + 2 + Math.random() * 6, vx: -(1.5 + Math.random() * 2.5), vy: 0.5 + Math.random() * 1.8,
      life: 1, decay: 0.05 + Math.random() * 0.04, size: 4, color: Math.random() < 0.5 ? '#ffd23f' : '#ff8a2a', g: 0
    });
}

function die(onGround) {
  if (state !== 'PLAYING') return;
  sfx.hit();
  shake = 10; flash = 1;
  if (score > best) {
    best = score; newBest = true;
    try { localStorage.setItem('flappy_hero_best', String(best)); } catch (e) {}
  }
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * 6.28, sp = 1.5 + Math.random() * 3.5;
    particles.push({
      x: heroX, y: hero.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
      life: 1, decay: 0.03 + Math.random() * 0.03, size: Math.random() < 0.5 ? 4 : 2,
      color: ['#ffffff', '#ffd23f', '#e8408f', '#19b5a5'][i % 4], g: 0.15
    });
  }
  if (onGround) land(); else { state = 'DYING'; hero.v = -3.5; sfx.fall(); }
}
function land() {
  state = 'OVER'; overT = 0;
  hero.y = PLAY_H - HIT_HH; hero.v = 0;
  sfx.thud();
  if (newBest) sfx.best();
  shake = Math.max(shake, 6);
  for (let i = 0; i < 10; i++)
    particles.push({
      x: heroX - 12 + Math.random() * 24, y: PLAY_H - 2, vx: (Math.random() - 0.5) * 4, vy: -(0.5 + Math.random() * 2),
      life: 1, decay: 0.04, size: 4, color: i % 2 ? '#ead596' : '#c9a65e', g: 0.1
    });
}

/* =========================================================================
   6. 업데이트 (고정 60Hz)
   ========================================================================= */
function step() {
  tick++;
  prevDist = dist; prevScrollX = scrollX; hero.prevY = hero.y; hero.prevRot = hero.rot;

  if (phaseBlend < 1) phaseBlend = Math.min(1, phaseBlend + 1 / 150);
  if (shake > 0) shake *= 0.86;
  if (shake < 0.3) shake = 0;
  if (flash > 0) flash = Math.max(0, flash - 0.08);
  if (scorePop > 0) scorePop = Math.max(0, scorePop - 0.1);

  let spd = 0;
  if (state === 'READY') {
    spd = 1.4;
    hero.y = PLAY_H * 0.45 + Math.sin(tick * 0.08) * 7;
    hero.rot = Math.sin(tick * 0.08 + 1.2) * 0.06;
  } else if (state === 'PLAYING') {
    spd = speedFor(score);
    dist += spd;

    hero.v = Math.min(hero.v + GRAVITY, MAX_FALL);
    hero.y += hero.v;
    if (hero.y < HIT_HH + 2) { hero.y = HIT_HH + 2; hero.v = 0; }
    hero.rot = lerp(hero.rot, clamp(hero.v * 0.075, -0.42, 1.05), 0.22);

    while (pipes.length === 0 || lastWX - dist + heroX < VW + 120) spawnPipe();

    for (let i = 0; i < pipes.length; i++) {
      const p = pipes[i];
      if (dist + HIT_HW > p.wx - 2 && dist - HIT_HW < p.wx + PIPE_W + 2) {
        const c = pipeCenter(p);
        if (hero.y - HIT_HH < c - p.gap / 2 || hero.y + HIT_HH > c + p.gap / 2) { die(false); break; }
      }
      if (!p.passed && p.wx + PIPE_W < dist - HIT_HW) {
        p.passed = true;
        score++; scorePop = 1;
        sfx.score();
        const ps = Math.floor(score / 10);
        if (ps !== phaseStep) {
          phaseStep = ps;
          phaseFrom = phaseTo; phaseTo = PHASE_SEQ[ps % PHASE_SEQ.length]; phaseBlend = 0;
          sfx.phase();
        }
      }
      if (p.wx - dist + heroX < -PIPE_W - 40) { pipes.splice(i, 1); i--; }
    }
    if (state === 'PLAYING' && hero.y + HIT_HH >= PLAY_H) die(true);

    if (state === 'PLAYING') {
      if (tick % 5 === 0) ghosts.push({ x: heroX, y: hero.y, rot: hero.rot, a: 0.3 });
      if (tick % 3 === 0)
        particles.push({
          x: heroX - 20, y: hero.y + 4 + Math.random() * 4, vx: -(1 + Math.random() * 1.5), vy: (Math.random() - 0.5) * 0.8,
          life: 1, decay: 0.07, size: 2, color: '#ffe9a8', g: 0
        });
    }
  } else if (state === 'DYING') {
    hero.v = Math.min(hero.v + GRAVITY * 1.4, 13);
    hero.y += hero.v;
    hero.rot += 0.28;
    if (hero.y + HIT_HH >= PLAY_H) land();
  } else if (state === 'OVER') {
    overT++;
    hero.rot = lerp(hero.rot, Math.round(hero.rot / Math.PI) * Math.PI + 0.25, 0.3);
    if (overT > 14 && shownScore < score) shownScore += Math.max(1, Math.ceil((score - shownScore) / 8));
  }
  scrollX += spd;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx - (state === 'PLAYING' ? spd * 0.3 : 0); p.y += p.vy; p.vy += p.g; p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = ghosts.length - 1; i >= 0; i--) {
    const g = ghosts[i];
    g.x -= 2.2; g.a -= 0.035;
    if (g.a <= 0) ghosts.splice(i, 1);
  }
  for (let i = lines.length - 1; i >= 0; i--) {
    const l = lines[i];
    l.x -= l.sp; l.a -= 0.05;
    if (l.a <= 0) lines.splice(i, 1);
  }
}

/* =========================================================================
   7. 렌더링
   ========================================================================= */
const R = v => Math.round(v * S) / S;        // 기기 픽셀에 스냅

function tile(img, offset, y, w, h) {
  let x = -(((offset % w) + w) % w);
  const ow = w + 1 / S;
  for (; x < VW; x += w) ctx.drawImage(img, R(x), y, ow, h);
}
function disc(cx, cy, r, color, px) {
  ctx.fillStyle = color;
  for (let y = -r; y < r; y += px) {
    const hw = Math.floor(Math.sqrt(r * r - (y + px / 2) * (y + px / 2)) / px) * px;
    if (hw > 0) ctx.fillRect(cx - hw, cy + y, hw * 2, px);
  }
}

function drawSky(pal, idx, a, sx) {
  ctx.globalAlpha = a;
  // 하늘: 계단식 그라데이션
  const bands = pal.sky, bh = PLAY_H / bands.length;
  for (let i = 0; i < bands.length; i++) {
    ctx.fillStyle = bands[i];
    ctx.fillRect(0, i * bh - 0.5, VW, bh + 1);
  }
  // 해 / 달
  const top = safe.t;
  if (idx === 0) {
    const { x: cx, y: cy } = lightPos(0);
    ctx.globalAlpha = a * 0.35; disc(cx, cy, 38, '#fff6c2', 2);
    ctx.globalAlpha = a; disc(cx, cy, 26, '#fff3a0', 2); disc(cx - 4, cy - 4, 16, '#fffbe0', 2);
  } else if (idx === 1) {
    const { x: cx, y: cy } = lightPos(1);
    ctx.globalAlpha = a * 0.3; disc(cx, cy, 64, '#ffe9a0', 2);
    ctx.globalAlpha = a; disc(cx, cy, 46, '#fff0a8', 2);
    ctx.fillStyle = bands[6];
    ctx.fillRect(cx - 46, cy + 14, 92, 4); ctx.fillRect(cx - 46, cy + 26, 92, 6);
  } else {
    const { x: cx, y: cy } = lightPos(2);
    ctx.globalAlpha = a * 0.18; disc(cx, cy, 36, '#cfd8ff', 2);
    ctx.globalAlpha = a; disc(cx, cy, 24, '#f4f1d0', 2);
    ctx.fillStyle = '#d5d0a6';
    ctx.fillRect(cx - 12, cy - 8, 6, 6); ctx.fillRect(cx + 4, cy + 2, 8, 6); ctx.fillRect(cx - 4, cy + 10, 4, 4);
  }
  drawBloom(idx, a);
  // 별
  if (pal.stars > 0) {
    ctx.fillStyle = '#ffffff';
    for (const s of STARS) {
      const tw = 0.55 + 0.45 * Math.sin(tick * 0.05 + s.ph);
      ctx.globalAlpha = a * pal.stars * tw;
      const sz = s.big ? 4 : 2;
      ctx.fillRect(Math.round(s.fx * VW / 2) * 2, Math.round(s.fy * PLAY_H / 2) * 2, sz, sz);
    }
  }
  ctx.globalAlpha = a;
  // 구름
  const span = VW + 260;
  for (const c of CLOUDS) {
    const x = R((((c.fx * span - sx * c.sp) % span) + span) % span - 130), y = c.y + top * 0.5, k = c.k;
    ctx.fillStyle = pal.cloudSh;
    ctx.fillRect(x + 4 * k, y + 26 * k, 66 * k, 4 * k);
    ctx.fillStyle = pal.cloud;
    ctx.fillRect(x, y + 12 * k, 74 * k, 16 * k);
    ctx.fillRect(x + 10 * k, y + 4 * k, 50 * k, 10 * k);
    ctx.fillRect(x + 22 * k, y - 4 * k, 26 * k, 10 * k);
  }
  // 스카이라인 2겹 + 덤불
  tile(pal.farImg, sx * 0.18, PLAY_H - FAR_H * 2 + 2, FAR_W * 2, FAR_H * 2);
  tile(pal.nearImg, sx * 0.38, PLAY_H - NEAR_H * 2 + 2, NEAR_W * 2, NEAR_H * 2);
  tile(pal.bushImg, sx * 0.62, PLAY_H - BUSH_H * 2, BUSH_W * 2, BUSH_H * 2);
  ctx.globalAlpha = 1;
}

function pipePart(x, y, h, t, isCap) {
  if (h <= 0) return;
  const w = isCap ? PIPE_W + CAP_OVER * 2 : PIPE_W;
  if (isCap) x -= CAP_OVER;
  ctx.fillStyle = INK;      ctx.fillRect(x, y, w, h);
  const ix = x + 3, iw = w - 6, iy = isCap ? y + 3 : y, ih = isCap ? h - 6 : h;
  ctx.fillStyle = t.main;   ctx.fillRect(ix, iy, iw, ih);
  ctx.fillStyle = t.hi2;    ctx.fillRect(ix, iy, 4, ih);
  ctx.fillStyle = t.hi;     ctx.fillRect(ix + 6, iy, 6, ih);
  ctx.fillStyle = t.hi2;    ctx.fillRect(ix + 14, iy, 2, ih);
  ctx.fillStyle = t.sh;     ctx.fillRect(ix + iw - 16, iy, 10, ih);
  ctx.fillStyle = t.dk;     ctx.fillRect(ix + iw - 6, iy, 6, ih);
  if (isCap) {
    ctx.fillStyle = t.hi;   ctx.fillRect(ix, iy, iw - 6, 2);
    ctx.fillStyle = t.dk;   ctx.fillRect(ix, iy + ih - 2, iw, 2);
  }
}
function drawPipes(camX, tintCol, tintA) {
  for (const p of pipes) {
    const x = R(p.wx - camX + heroX);
    if (x > VW + 10 || x < -PIPE_W - 10) continue;
    const t = THEMES[p.theme];
    const c = pipeCenter(p);
    const top = Math.round(c - p.gap / 2), bot = Math.round(c + p.gap / 2);
    // 위 기둥: 화면 맨 위(노치 포함)까지 이어진다
    pipePart(x, -4, top - CAP_H + 4, t, false);
    ctx.fillStyle = t.dk; ctx.fillRect(x + 3, top - CAP_H - 4, PIPE_W - 6, 4);
    pipePart(x, top - CAP_H, CAP_H, t, true);
    // 아래 기둥
    pipePart(x, bot + CAP_H, PLAY_H - bot - CAP_H, t, false);
    ctx.fillStyle = t.dk; ctx.fillRect(x + 3, bot + CAP_H, PIPE_W - 6, 4);
    pipePart(x, bot, CAP_H, t, true);
    if (p.amp) {    // 움직이는 기둥 표시등
      ctx.fillStyle = (tick >> 3) & 1 ? '#fff27a' : '#ff5d8f';
      ctx.fillRect(x + PIPE_W / 2 - 3, top - 16, 6, 6);
      ctx.fillRect(x + PIPE_W / 2 - 3, bot + 10, 6, 6);
    }
    if (tintA > 0) {
      ctx.globalAlpha = tintA; ctx.fillStyle = tintCol;
      ctx.fillRect(x, -4, PIPE_W, top - CAP_H + 4);
      ctx.fillRect(x - CAP_OVER, top - CAP_H, PIPE_W + CAP_OVER * 2, CAP_H);
      ctx.fillRect(x - CAP_OVER, bot, PIPE_W + CAP_OVER * 2, CAP_H);
      ctx.fillRect(x, bot + CAP_H, PIPE_W, PLAY_H - bot - CAP_H);
      ctx.globalAlpha = 1;
    }
  }
}

// 광원 주변의 블룸(번짐). 기둥보다 뒤에 그려 실루엣이 살아나게 한다.
function drawBloom(idx, a) {
  const lt = LIGHTS[idx], lp = lightPos(idx), R0 = lt.r * 5;
  const g = ctx.createRadialGradient(lp.x, lp.y, 0, lp.x, lp.y, R0);
  g.addColorStop(0, 'rgba(' + lt.core + ',1)');
  g.addColorStop(0.16, 'rgba(' + lt.core + ',0.9)');
  g.addColorStop(0.3, 'rgba(' + lt.rgb + ',0.5)');
  g.addColorStop(0.6, 'rgba(' + lt.rgb + ',0.14)');
  g.addColorStop(1, 'rgba(' + lt.rgb + ',0)');
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = a * Math.min(1, lt.k * 1.2);
  ctx.fillStyle = g;
  ctx.fillRect(lp.x - R0, lp.y - R0, R0 * 2, R0 * 2);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = a;
}

function drawGodRays(idx, weight, camX, hy, hr, sx) {
  if (weight <= 0.01 || !fxRays) return;
  const w = Math.ceil(VW / GR) + 1, h = Math.ceil(PLAY_H / GR);
  for (const c of [occCv, blurCv, rayCv]) if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  const lt = LIGHTS[idx], lp = lightPos(idx), lx = lp.x, ly = lp.y;

  // 1) 광원 + 차폐물
  let g = occCtx;
  g.setTransform(1 / GR, 0, 0, 1 / GR, 0, 0);
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
  g.clearRect(0, 0, w * GR, h * GR);
  const grad = g.createRadialGradient(lx, ly, 0, lx, ly, lt.halo);
  grad.addColorStop(0, 'rgba(' + lt.core + ',1)');
  grad.addColorStop(lt.r / lt.halo, 'rgba(' + lt.core + ',1)');
  grad.addColorStop(lt.r * 2 / lt.halo, 'rgba(' + lt.rgb + ',0.55)');
  grad.addColorStop(0.5, 'rgba(' + lt.rgb + ',0.12)');
  grad.addColorStop(1, 'rgba(' + lt.rgb + ',0)');
  g.fillStyle = grad;
  g.fillRect(lx - lt.halo, ly - lt.halo, lt.halo * 2, lt.halo * 2);

  g.globalCompositeOperation = 'destination-out';
  g.imageSmoothingEnabled = false;
  const tileOcc = (img, offset, y, tw, th, a) => {
    g.globalAlpha = a;
    for (let x = -(((offset % tw) + tw) % tw); x < VW; x += tw) g.drawImage(img, x, y, tw + 1, th);
  };
  tileOcc(PALS[0].farImg, sx * 0.18, PLAY_H - FAR_H * 2 + 2, FAR_W * 2, FAR_H * 2, 0.8);   // 먼 건물은 대기에 살짝 묻힌다
  tileOcc(PALS[0].nearImg, sx * 0.38, PLAY_H - NEAR_H * 2 + 2, NEAR_W * 2, NEAR_H * 2, 1);
  g.globalAlpha = 1;
  g.fillStyle = '#000';
  for (const p of pipes) {
    const x = p.wx - camX + heroX;
    if (x > VW + 20 || x < -PIPE_W - 20) continue;
    const c = pipeCenter(p), top = c - p.gap / 2, bot = c + p.gap / 2;
    g.fillRect(x, -10, PIPE_W, top - CAP_H + 10);
    g.fillRect(x - CAP_OVER, top - CAP_H, PIPE_W + CAP_OVER * 2, CAP_H);
    g.fillRect(x - CAP_OVER, bot, PIPE_W + CAP_OVER * 2, CAP_H);
    g.fillRect(x, bot + CAP_H, PIPE_W, PLAY_H - bot - CAP_H + 10);
  }
  g.save();
  g.translate(heroX, hy); g.rotate(hr);
  g.drawImage(heroSprite, -HERO_W / 2, -HERO_H / 2, HERO_W, HERO_H);
  g.fillRect(-30, -9, 36, 8);                                   // 망토
  g.restore();

  // 2) 방사형 블러: 1차(촘촘하게) → 2차(멀리) 두 단계로 겹쳐 적은 횟수로 긴 빛줄기를 만든다
  const cx = lx / GR, cy = ly / GR;
  g = blurCtx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-over';
  g.clearRect(0, 0, w, h);
  g.globalCompositeOperation = 'lighter';
  g.imageSmoothingEnabled = true;
  const N1 = 8;
  g.globalAlpha = 1 / N1;
  for (let i = 0; i < N1; i++) {
    const k = 1 + i * 0.028;
    g.setTransform(k, 0, 0, k, cx * (1 - k), cy * (1 - k));
    g.drawImage(occCv, 0, 0);
  }
  g = rayCtx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-over';
  g.clearRect(0, 0, w, h);
  g.globalCompositeOperation = 'lighter';
  g.imageSmoothingEnabled = true;
  const N2 = 8, DEC = 0.87;
  let sum = 0;
  for (let j = 0; j < N2; j++) sum += Math.pow(DEC, j);
  for (let j = 0; j < N2; j++) {
    const k = Math.pow(1.26, j);
    g.globalAlpha = Math.pow(DEC, j) / sum;
    g.setTransform(k, 0, 0, k, cx * (1 - k), cy * (1 - k));
    g.drawImage(blurCv, 0, 0);
  }

  // 3) 합성 (부드럽게 확대해서 가산)
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = clamp(weight * lt.k * 1.3, 0, 1);
  ctx.drawImage(rayCv, 0, 0, w * GR, h * GR);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.imageSmoothingEnabled = false;
}

// 땅에 비치는 빛 (광원이 기둥에 가리면 약해진다)
function drawGroundGlow(idx, weight, camX) {
  if (weight <= 0.01) return;
  const lt = LIGHTS[idx], lp = lightPos(idx);
  let open = 1;
  for (const p of pipes) {
    const x = p.wx - camX + heroX;
    const cov = clamp((Math.min(x + PIPE_W, lp.x + lt.r) - Math.max(x, lp.x - lt.r)) / (lt.r * 2), 0, 1);
    open = Math.min(open, 1 - cov * 0.85);
  }
  ctx.save();
  ctx.beginPath(); ctx.rect(0, PLAY_H, VW, VH - PLAY_H); ctx.clip();
  ctx.translate(lp.x, PLAY_H);
  ctx.scale(1, 0.55);
  const R0 = 190;
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R0);
  g.addColorStop(0, 'rgba(' + lt.core + ',0.9)');
  g.addColorStop(0.25, 'rgba(' + lt.rgb + ',0.45)');
  g.addColorStop(1, 'rgba(' + lt.rgb + ',0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = weight * lt.refl * open;
  ctx.fillStyle = g;
  ctx.fillRect(-R0, 0, R0 * 2, R0);
  ctx.restore();
}

function drawGround(sx, tintCol, tintA) {
  const y = PLAY_H;
  // 흙
  const off = ((sx % (DIRT_W * 2)) + DIRT_W * 2) % (DIRT_W * 2);
  for (let ty = y + 16; ty < VH; ty += DIRT_H * 2)
    for (let tx = -off; tx < VW; tx += DIRT_W * 2)
      ctx.drawImage(dirtImg, R(tx), ty, DIRT_W * 2 + 1 / S, DIRT_H * 2 + 1 / S);
  // 깊어질수록 어둡게 (세로로 긴 화면용)
  const depth = VH - y - 16;
  for (let i = 1; i <= 4; i++) {
    const dy = y + 16 + 34 * i * i * 0.5;
    if (dy >= VH) break;
    ctx.fillStyle = 'rgba(120,70,20,0.13)';
    ctx.fillRect(0, dy, VW, VH - dy);
  }
  // 잔디
  ctx.fillStyle = '#7ccf3f'; ctx.fillRect(0, y, VW, 16);
  ctx.fillStyle = '#a5e65a';
  const g = ((sx % 24) + 24) % 24;
  for (let x = -24 - g; x < VW + 24; x += 24)
    for (let k = 0; k < 6; k++) ctx.fillRect(R(x + k * 2), y + 2 + k * 2, 10, 2);
  ctx.fillStyle = '#c9f58a'; ctx.fillRect(0, y, VW, 2);
  ctx.fillStyle = '#4f9a2b'; ctx.fillRect(0, y + 14, VW, 2);
  ctx.fillStyle = '#b98f4a'; ctx.fillRect(0, y + 16, VW, 2);
  ctx.fillStyle = INK;       ctx.fillRect(0, y - 2, VW, 2);
  if (tintA > 0) {
    ctx.globalAlpha = tintA; ctx.fillStyle = tintCol;
    ctx.fillRect(0, y - 2, VW, VH - y + 2);
    ctx.globalAlpha = 1;
  }
}

function drawCape() {
  // 어깨에서 뒤로 흩날리는 망토 (2유닛 도트 기둥으로 그린다)
  const cols = 17;
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < cols; i++) {
      const x = 4 - i * 2;
      const wave = Math.sin(tick * 0.34 - i * 0.55) * i * 0.3 + Math.cos(tick * 0.21 - i * 0.3) * i * 0.12;
      const y = Math.round((-7 + wave) / 2) * 2;
      const th = i < 3 ? 6 : i > 13 ? 6 : 8;
      if (pass === 0) {
        ctx.fillStyle = INK;
        ctx.fillRect(x - (i === cols - 1 ? 2 : 0), y - 2, 2 + (i === cols - 1 ? 2 : 0), th + 4);
      } else {
        ctx.fillStyle = '#e8408f'; ctx.fillRect(x, y, 2, th);
        ctx.fillStyle = '#ff7ab8'; ctx.fillRect(x, y, 2, 2);
        ctx.fillStyle = '#a82468'; ctx.fillRect(x, y + th - 2, 2, 2);
      }
    }
  }
}
function drawHero(y, rot) {
  ctx.save();
  ctx.translate(R(heroX), R(y));
  ctx.rotate(rot);
  drawCape();
  ctx.drawImage(heroSprite, -HERO_W / 2, -HERO_H / 2, HERO_W, HERO_H);
  ctx.restore();
}

function text(str, x, y, size, fill, opt) {
  opt = opt || {};
  ctx.font = size + 'px ' + FONT;
  ctx.textAlign = opt.align || 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  const ow = opt.outline === undefined ? Math.max(4, size * 0.3) : opt.outline;
  if (ow > 0) {
    ctx.strokeStyle = INK; ctx.lineWidth = ow;
    if (opt.shadow !== false) ctx.strokeText(str, x, y + Math.max(2, size * 0.12));
    ctx.strokeText(str, x, y);
  }
  ctx.fillStyle = fill;
  ctx.fillText(str, x, y);
}

const MEDALS = [
  { min: 50, name: 'PLATINUM', a: '#e9fbff', b: '#9fd9e8', c: '#5fa9be' },
  { min: 35, name: 'GOLD',     a: '#fff3a0', b: '#ffcb3d', c: '#c98a12' },
  { min: 20, name: 'SILVER',   a: '#ffffff', b: '#cfd6e0', c: '#8d97a8' },
  { min: 10, name: 'BRONZE',   a: '#ffd0a0', b: '#d98a4e', c: '#96552a' }
];
function drawMedal(cx, cy, m) {
  if (!m) {
    disc(cx, cy, 20, '#d8c79a', 2); disc(cx, cy, 16, '#e6d8ae', 2);
    return;
  }
  ctx.fillStyle = INK;       ctx.fillRect(cx - 12, cy - 30, 24, 16);
  ctx.fillStyle = '#e8408f'; ctx.fillRect(cx - 10, cy - 28, 8, 14);
  ctx.fillStyle = '#19b5a5'; ctx.fillRect(cx + 2, cy - 28, 8, 14);
  disc(cx, cy, 22, INK, 2); disc(cx, cy, 20, m.c, 2); disc(cx, cy - 1, 18, m.b, 2); disc(cx - 2, cy - 3, 12, m.a, 2);
  ctx.fillStyle = m.c;       // 별
  ctx.fillRect(cx - 2, cy - 10, 4, 4); ctx.fillRect(cx - 10, cy - 6, 20, 4);
  ctx.fillRect(cx - 6, cy - 2, 12, 4); ctx.fillRect(cx - 8, cy + 2, 6, 4); ctx.fillRect(cx + 2, cy + 2, 6, 4);
}

function muteRect() {
  const s = 30 * ui;
  return { x: VW - safe.r - s - 10, y: safe.t + 10, s };
}
function drawMute() {
  const r = muteRect(), k = r.s / 30;
  ctx.save();
  ctx.translate(r.x, r.y); ctx.scale(k, k);
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = INK; ctx.fillRect(0, 0, 30, 30);
  ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fillRect(2, 2, 26, 26);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(7, 12, 4, 6); ctx.fillRect(11, 10, 2, 10); ctx.fillRect(13, 8, 2, 14);
  if (muted) {
    ctx.fillStyle = '#ff5d6c';
    ctx.fillRect(18, 11, 2, 2); ctx.fillRect(22, 11, 2, 2); ctx.fillRect(20, 13, 2, 2); ctx.fillRect(18, 15, 2, 2); ctx.fillRect(22, 15, 2, 2);
  } else {
    ctx.fillRect(18, 12, 2, 6); ctx.fillRect(21, 9, 2, 12);
  }
  ctx.restore();
}

const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

function drawUI() {
  const cx = VW / 2, top = safe.t;
  drawMute();

  if (state === 'PLAYING' || state === 'DYING') {
    const k = ui * (1 + scorePop * 0.28);
    ctx.save();
    ctx.translate(cx, top + 30 + 40 * ui); ctx.scale(k, k);
    text(String(score), 0, 0, 36, '#ffffff', { outline: 10 });
    ctx.restore();
  }

  if (state === 'READY') {
    ctx.save();
    ctx.translate(cx, Math.max(top + 150 * ui, PLAY_H * 0.25)); ctx.scale(ui, ui);
    const bob = Math.round(Math.sin(tick * 0.05) * 3);
    text('FLAPPY', 0, -44 + bob, 30, '#ffffff', { outline: 10 });
    text('HERO', 0, 2 + bob, 42, '#ffd23f', { outline: 12 });
    text('BEST ' + best, 0, 36, 12, '#bff4ff', { outline: 5 });
    ctx.restore();

    ctx.save();
    ctx.translate(cx, PLAY_H * 0.45 + 92 * ui); ctx.scale(ui, ui);
    if ((tick >> 5) & 1 || tick < 20) text(coarse ? 'TAP TO FLY' : 'CLICK / SPACE', 0, 0, 14, '#ffffff', { outline: 6 });
    ctx.restore();
  }

  if (state === 'OVER') {
    const t = clamp(overT / 18, 0, 1), e = 1 - (1 - t) * (1 - t);
    ctx.save();
    ctx.translate(cx, Math.min(VH * 0.44, PLAY_H * 0.5) + (1 - e) * 40); ctx.scale(ui, ui);
    ctx.globalAlpha = e;

    text('GAME OVER', 0, -92, 26, '#ff5d6c', { outline: 9 });

    // 결과 패널
    const pw = 280, ph = 152, px = -pw / 2, py = -70;
    ctx.fillStyle = 'rgba(27,21,48,0.35)'; ctx.fillRect(px + 4, py + 6, pw, ph);
    ctx.fillStyle = INK;       ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = '#f7ecc6'; ctx.fillRect(px + 4, py + 4, pw - 8, ph - 8);
    ctx.fillStyle = '#e3d19a'; ctx.fillRect(px + 4, py + ph - 12, pw - 8, 8);
    ctx.fillStyle = '#fffaf0'; ctx.fillRect(px + 4, py + 4, pw - 8, 4);

    const medal = MEDALS.find(m => score >= m.min);
    text('MEDAL', -78, py + 30, 10, '#c8742b', { outline: 0 });
    drawMedal(-78, py + 84, overT > 22 ? medal : null);
    text(overT > 22 && medal ? medal.name : '10+', -78, py + 130, 8, '#a8946a', { outline: 0 });

    text('SCORE', 122, py + 30, 10, '#c8742b', { outline: 0, align: 'right' });
    text(String(shownScore), 122, py + 62, 22, '#ffffff', { outline: 7, align: 'right' });
    text('BEST', 122, py + 92, 10, '#c8742b', { outline: 0, align: 'right' });
    text(String(best), 122, py + 124, 22, '#ffd23f', { outline: 7, align: 'right' });
    if (newBest && overT > 26) {
      ctx.fillStyle = INK;       ctx.fillRect(22, py + 78, 42, 18);
      ctx.fillStyle = '#ff5d6c'; ctx.fillRect(24, py + 80, 38, 14);
      text('NEW', 43, py + 92, 9, '#ffffff', { outline: 0 });
    }

    if (overT > RETRY_DELAY && ((overT >> 5) & 1) === 0)
      text(coarse ? 'TAP TO RETRY' : 'CLICK / SPACE', 0, py + ph + 40, 14, '#ffffff', { outline: 6 });
    ctx.restore();
  }

  if (paused) {
    ctx.fillStyle = 'rgba(27,21,48,0.55)';
    ctx.fillRect(0, 0, VW, VH);
    ctx.save();
    ctx.translate(cx, VH * 0.42); ctx.scale(ui, ui);
    text('PAUSED', 0, 0, 28, '#ffffff', { outline: 9 });
    text(coarse ? 'TAP TO RESUME' : 'CLICK / SPACE', 0, 36, 12, '#bff4ff', { outline: 5 });
    ctx.restore();
  }
}

function render(alpha) {
  const camX = lerp(prevDist, dist, alpha);
  const sx = lerp(prevScrollX, scrollX, alpha);
  const hy = lerp(hero.prevY, hero.y, alpha);
  const hr = lerp(hero.prevRot, hero.rot, alpha);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PALS[phaseTo].sky[0];
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let ox = 0, oy = 0;
  if (shake > 0) { ox = (Math.random() - 0.5) * shake; oy = (Math.random() - 0.5) * shake; }
  ctx.setTransform(S, 0, 0, S, Math.round(ox * S), Math.round(oy * S));
  ctx.imageSmoothingEnabled = false;

  // 배경 (시간대 전환은 두 팔레트를 겹쳐서 페이드)
  const A = PALS[phaseFrom], B = PALS[phaseTo];
  if (phaseBlend < 1) drawSky(A, phaseFrom, 1, sx);
  drawSky(B, phaseTo, phaseBlend < 1 ? phaseBlend : 1, sx);

  // 장애물과 땅은 시간대에 맞춰 색을 덮는다
  const tintCol = B.tint || A.tint || 'rgba(0,0,0,0)';
  const tintA = B.tint ? (A.tint && phaseBlend < 1 ? 1 : phaseBlend) : (A.tint && phaseBlend < 1 ? 1 - phaseBlend : 0);
  drawPipes(camX, tintCol, tintA);
  if (phaseBlend < 1) drawGodRays(phaseFrom, 1 - phaseBlend, camX, hy, hr, sx);
  drawGodRays(phaseTo, phaseBlend, camX, hy, hr, sx);
  drawGround(sx, tintCol, tintA);
  if (phaseBlend < 1) drawGroundGlow(phaseFrom, 1 - phaseBlend, camX);
  drawGroundGlow(phaseTo, phaseBlend, camX);

  // 잔상 / 스피드 라인 / 파티클
  for (const g of ghosts) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, g.a);
    ctx.translate(R(g.x), R(g.y)); ctx.rotate(g.rot);
    ctx.drawImage(heroGhost, -HERO_W / 2, -HERO_H / 2, HERO_W, HERO_H);
    ctx.restore();
  }
  ctx.fillStyle = '#ffffff';
  for (const l of lines) {
    ctx.globalAlpha = Math.max(0, l.a);
    ctx.fillRect(R(l.x - l.len), Math.round(l.y / 2) * 2, l.len, 2);
  }
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life * 1.4, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(R(p.x), R(p.y), p.size, p.size);
  }
  ctx.globalAlpha = 1;

  drawHero(hy, hr);

  if (flash > 0) {
    ctx.globalAlpha = flash * 0.7; ctx.fillStyle = '#ffffff';
    ctx.fillRect(-20, -20, VW + 40, VH + 40);
    ctx.globalAlpha = 1;
  }

  ctx.setTransform(S, 0, 0, S, 0, 0);
  drawUI();
}

/* =========================================================================
   8. 입력
   ========================================================================= */
function action() {
  initAudio();
  if (paused) {
    paused = false;
    if (state === 'PLAYING') flap();
    return;
  }
  if (state === 'READY') { state = 'PLAYING'; flap(); }
  else if (state === 'PLAYING') flap();
  else if (state === 'OVER' && overT > RETRY_DELAY) resetGame();
}

window.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  const ux = e.clientX / scale, uy = e.clientY / scale, m = muteRect();
  if (ux >= m.x - 8 && ux <= m.x + m.s + 8 && uy >= m.y - 8 && uy <= m.y + m.s + 8) {
    initAudio(); setMuted(!muted);
    return;
  }
  action();
}, { passive: false });
window.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
window.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('gesturestart', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') {
    e.preventDefault();
    if (!e.repeat) action();
  } else if (e.code === 'KeyM') {
    initAudio(); setMuted(!muted);
  } else if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'PLAYING') {
    paused = !paused;
  }
});

// 앱 전환/탭 이동 시 자동 일시정지
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'PLAYING') paused = true;
});
window.addEventListener('blur', () => { if (state === 'PLAYING') paused = true; });

/* =========================================================================
   9. 메인 루프
   ========================================================================= */
let lastT = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = now - lastT;
  lastT = now;
  if (dt > 250 || dt < 0) dt = STEP_MS;
  slowMs = slowMs * 0.95 + dt * 0.05;
  if (++slowN > 45 && slowMs > 24 && quality < DPR_CAPS.length - 1) {
    quality++; slowN = 0; slowMs = 16.7;
    if (quality === DPR_CAPS.length - 1) fxRays = false;
    resize();
  }
  acc += dt;
  let n = 0;
  while (acc >= STEP_MS && n < 5) {
    if (!paused) step();
    acc -= STEP_MS; n++;
  }
  if (n === 5) acc = 0;
  render(paused ? 1 : acc / STEP_MS);
}

if (document.fonts && document.fonts.load) document.fonts.load('16px "Press Start 2P"').catch(() => {});
requestAnimationFrame(t => { lastT = t; frame(t); });

// 자동 테스트/디버그용 훅
window.__game = {
  get state() { return state; }, get score() { return score; },
  get hero() { return hero; }, get pipes() { return pipes; }, get dist() { return dist; },
  pipeCenter, action, get quality() { return quality; }, set rays(v) { fxRays = v; },
  setScore(n) { score = n; }
};
})();
</script>
</body>
