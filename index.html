<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3f8fd8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Flappy Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #3f8fd8;
      position: fixed;
      inset: 0;
    }
    canvas {
      position: fixed;
      left: 0;
      top: 0;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    /* 노치/홈 인디케이터 영역 측정용 */
    #safe {
      position: fixed;
      visibility: hidden;
      pointer-events: none;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    }
  </style>
</head>
<body>
<div id="safe"></div>
<canvas id="gameCanvas"></canvas>

<script>
(() => {
'use strict';

/* =========================================================================
   1. 가상 해상도
   -------------------------------------------------------------------------
   모든 게임 로직은 "유닛" 좌표로 계산한다. 플레이 영역 높이는 어떤 기기에서도
   560유닛으로 동일하고, 화면 크기에 따라 배율(scale)만 달라진다.
   세로로 아주 긴 화면은 남는 공간을 땅으로 채우고, 가로로 넓은 화면은
   더 멀리 보일 뿐 장애물 간격·속도·판정은 완전히 같다.
   ========================================================================= */
const PLAY_H = 560;        // 하늘(플레이 영역) 높이
const MIN_GROUND = 80;     // 땅 최소 높이
const MIN_H = PLAY_H + MIN_GROUND;
const MIN_W = 300;         // 보장되는 최소 가로 유닛
const INK = '#1b1530';     // 외곽선 색
const FONT = '"Press Start 2P", ui-monospace, Menlo, Consolas, monospace';

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const safeEl = document.getElementById('safe');

// 성능 자동 조절: 프레임이 계속 밀리면 렌더 해상도를 단계적으로 낮추고, 마지막엔 빛 효과를 끈다
const DPR_CAPS = [3, 2, 1.5, 1, 1];
let quality = 0, fxRays = true, slowMs = STEP_GUESS(), slowN = 0;
function STEP_GUESS() { return 16.7; }
let cssW = 1, cssH = 1, dpr = 1, scale = 1, S = 1;
let VW = MIN_W, VH = MIN_H, groundH = MIN_GROUND, heroX = 90, ui = 1;
const safe = { t: 0, r: 0, b: 0, l: 0 };

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

function resize() {
  cssW = Math.max(1, window.innerWidth);
  cssH = Math.max(1, window.innerHeight);
  dpr = clamp(window.devicePixelRatio || 1, 1, DPR_CAPS[quality]);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);

  scale = Math.min(cssH / MIN_H, cssW / MIN_W);
  S = scale * dpr;
  VW = cssW / scale;
  VH = cssH / scale;
  groundH = VH - PLAY_H;

  const cs = getComputedStyle(safeEl);
  safe.t = (parseFloat(cs.paddingTop) || 0) / scale;
  safe.r = (parseFloat(cs.paddingRight) || 0) / scale;
  safe.b = (parseFloat(cs.paddingBottom) || 0) / scale;
  safe.l = (parseFloat(cs.paddingLeft) || 0) / scale;

  heroX = clamp(VW * 0.26, 84, 230) + safe.l;
  // 화면이 아주 작을 때(가로 모드 폰 등) 글자가 읽히도록 UI만 키운다
  ui = clamp(0.8 / scale, 1, 1.5);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

/* =========================================================================
   2. 사운드
   ========================================================================= */
let audioCtx = null, master = null, muted = false;
try { muted = localStorage.getItem('flappy_hero_muted') === '1'; } catch (e) {}

function initAudio() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      master = audioCtx.createGain();
      master.gain.value = muted ? 0 : 0.6;
      master.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
function setMuted(m) {
  muted = m;
  if (master) master.gain.value = muted ? 0 : 0.6;
  try { localStorage.setItem('flappy_hero_muted', muted ? '1' : '0'); } catch (e) {}
}
function tone(type, f0, f1, dur, vol, delay) {
  if (!audioCtx || muted) return;
  try {
    const t = audioCtx.currentTime + (delay || 0);
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function noise(dur, vol, f0, f1) {
  if (!audioCtx || muted) return;
  try {
    const n = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const f = audioCtx.createBiquadFilter();
    f.type = 'lowpass';
    const t = audioCtx.currentTime;
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t);
  } catch (e) {}
}
const sfx = {
  flap()  { tone('triangle', 300, 660, 0.11, 0.28); },
  score() { tone('square', 988, 988, 0.07, 0.12); tone('square', 1319, 1319, 0.16, 0.12, 0.07); },
  hit()   { noise(0.28, 0.5, 900, 60); tone('square', 160, 50, 0.2, 0.2); },
  fall()  { tone('sine', 720, 180, 0.38, 0.16, 0.08); },
  thud()  { noise(0.16, 0.4, 400, 50); },
  best()  { [523, 659, 784, 1047].forEach((f, i) => tone('square', f, f, 0.14, 0.12, 0.35 + i * 0.09)); },
  phase() { tone('triangle', 660, 990, 0.25, 0.1); }
};

/* =========================================================================
   3. 도트 아트 에셋 (전부 코드로 미리 그려 둔다)
   ========================================================================= */
function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return [c, g];
}

/* --- 주인공: 헬멧과 고글을 쓴 오리지널 히어로 (20x10 도트) --- */
const HERO_ROWS = [
  '..............KKKK..',
  '.............KHHHHK.',
  '............KHHVGVVK',
  '............KhHFFFFK',
  '...KKKKKKKKKKDFFFFK.',
  '.KKBBSSSSSSSSSSKKKKK',
  'KBBBSSSSWWSSSSSSSOOK',
  'KBBBDSSSSSSDDDKKKKK.',
  '.KKBDDDDDDDKKK......',
  '...KKKKKKKK.........'
];
const HERO_PAL = {
  K: INK, H: '#f6f3ea', h: '#cfc9bd', V: '#2b2d5b', G: '#8fe9ff', F: '#ffcf9f',
  S: '#19b5a5', D: '#0e7f78', B: '#ff8a2a', O: '#ff8a2a', W: '#fff4b8'
};
const HERO_PX = 2;                          // 도트 1칸 = 2유닛
const HERO_W = HERO_ROWS[0].length * HERO_PX;
const HERO_H = HERO_ROWS.length * HERO_PX;
function buildSprite(rows, pal, solid) {
  const [c, g] = makeCanvas(rows[0].length, rows.length);
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const ch = row[x];
      if (ch === '.') continue;
      g.fillStyle = solid || pal[ch];
      g.fillRect(x, y, 1, 1);
    }
  });
  return c;
}
const heroSprite = buildSprite(HERO_ROWS, HERO_PAL);
const heroGhost = buildSprite(HERO_ROWS, HERO_PAL, '#bff4ff');

/* --- 시간대 팔레트: 낮 / 노을 / 밤 / 새벽. 실제 색은 시간에 따라 이 사이를 연속으로 보간한다 --- */
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const PALS = [
  { // 0 낮
    sky: ['#3f8fd8', '#4f9fe0', '#62aee6', '#78bdea', '#92cbee', '#aed9f1', '#c8e6f4', '#dff0f6'],
    cloud: '#ffffff', cloudSh: '#d3e6f5',
    far: '#9cc6e0', farSh: '#89b6d3', farWin: '#b0d2e6',
    near: '#6f9fc6', nearSh: '#5c8bb3', nearWin: '#8fb9d9',
    bush: '#5fae3a', bushHi: '#86cf52', tint: [255, 255, 255, 0], stars: 0
  },
  { // 1 노을
    sky: ['#3b2a6b', '#5a3580', '#874089', '#b8497c', '#de5468', '#f06a52', '#f68a50', '#fbb070'],
    cloud: '#ffd9c7', cloudSh: '#f3a0a0',
    far: '#b0608a', farSh: '#9a4f7c', farWin: '#c57a95',
    near: '#5e2f66', nearSh: '#4a2355', nearWin: '#7a4379',
    bush: '#4f7a3a', bushHi: '#8aa34c', tint: [255, 110, 50, 0.16], stars: 0.2
  },
  { // 2 밤
    sky: ['#070b24', '#0b1233', '#101a44', '#162354', '#1d2d63', '#243872', '#2c4380', '#35508d'],
    cloud: '#5b6baa', cloudSh: '#45528d',
    far: '#22306a', farSh: '#1b2759', farWin: '#2c3c7c',
    near: '#111a42', nearSh: '#0c1335', nearWin: '#1b2757',
    bush: '#1f4a3c', bushHi: '#2f6a4c', tint: [8, 14, 62, 0.42], stars: 1
  },
  { // 3 새벽
    sky: ['#2f3a78', '#4a4a90', '#7a5a9c', '#b0689a', '#de707e', '#f2866c', '#f8a674', '#fbc890'],
    cloud: '#ffe6de', cloudSh: '#e6a9b9',
    far: '#9a7aa6', farSh: '#86689a', farWin: '#b08fb6',
    near: '#4a3a6e', nearSh: '#3a2c5c', nearWin: '#62507f',
    bush: '#3f6f44', bushHi: '#6f9a54', tint: [255, 140, 120, 0.12], stars: 0.2
  }
];
for (const p of PALS) { p.skyRGB = p.sky.map(hex); p.cloudRGB = hex(p.cloud); p.cloudShRGB = hex(p.cloudSh); }

/* 하루 = tod 0→1.  낮(0) → 노을(0.30) → 밤(0.42~0.72) → 새벽(0.85) → 낮(1) */
const TIMELINE = [[0, 0], [0.17, 0], [0.30, 1], [0.42, 2], [0.72, 2], [0.85, 3], [1, 0]];
const DAY_LEN = 10500;                 // 하루가 지나는 데 필요한 비행 거리 (약 40점)
const smooth = t => t * t * (3 - 2 * t);
// 창문 불빛 기준이 되는 "어두움" 0~1
function darkness(T) {
  if (T < 0.25) return 0;
  if (T < 0.44) return (T - 0.25) / 0.19;
  if (T < 0.69) return 1;
  if (T < 0.88) return 1 - (T - 0.69) / 0.19;
  return 0;
}

/* --- 스카이라인 (1도트 = 2유닛, 반복 타일) --- */
const WIN_COLS = ['#ffd866', '#ffe9a0', '#ffc457', '#ffd866', '#dfeaff'];
function genSkyline(seed, LW, minW, maxW, minH, maxH) {
  const r = mulberry(seed), list = [];
  let x = 0;
  while (x < LW) {
    let w = minW + Math.floor(r() * (maxW - minW + 1));
    if (LW - x - w < minW) w = LW - x;
    const h = minH + Math.floor(r() * (maxH - minH + 1));
    const roof = r();
    const wins = [];
    for (let wy = 4; wy < h - 4; wy += 5)
      for (let wx = 2; wx <= w - 5; wx += 4) {
        // th: 이 창문에 불이 들어오는 어두움 기준. 창문마다 달라서 하나씩 켜지고 꺼진다 (일부는 끝까지 안 켜짐)
        const th = r() < 0.34 ? 2 : 0.04 + r() * 0.94;
        wins.push({ x: wx, y: wy, th, col: WIN_COLS[Math.floor(r() * WIN_COLS.length)] });
      }
    list.push({ x, w, h, roof, wins });
    x += w;
  }
  return list;
}
function renderSkyline(list, LW, LH, body, shade, win) {
  const [c, g] = makeCanvas(LW, LH);
  for (const b of list) {
    const top = LH - b.h;
    g.fillStyle = body;
    g.fillRect(b.x, top, b.w - 1, b.h);
    g.fillStyle = shade;
    g.fillRect(b.x + b.w - 3, top, 2, b.h);
    if (b.roof < 0.3) {                         // 안테나
      g.fillStyle = shade;
      g.fillRect(b.x + (b.w >> 1), top - 8, 1, 8);
      g.fillRect(b.x + (b.w >> 1) - 1, top - 2, 3, 2);
    } else if (b.roof < 0.6) {                  // 계단식 옥상
      g.fillStyle = body;
      g.fillRect(b.x + 3, top - 4, b.w - 7, 4);
      g.fillStyle = shade;
      g.fillRect(b.x + b.w - 6, top - 4, 2, 4);
    } else if (b.roof < 0.78) {                 // 물탱크
      g.fillStyle = shade;
      g.fillRect(b.x + 3, top - 5, 5, 4);
      g.fillRect(b.x + 4, top - 1, 1, 1);
      g.fillRect(b.x + 6, top - 1, 1, 1);
    }
    g.fillStyle = win;
    for (const w of b.wins) g.fillRect(b.x + w.x, top + w.y, 2, 3);
  }
  return c;
}
const FAR_W = 360, FAR_H = 152, NEAR_W = 448, NEAR_H = 112;   // 8의 배수 (불빛 번짐 버퍼용)

/* 건물 레이어: 팔레트별 본체 이미지 + 켜진 창문만 담는 오버레이 + 그 오버레이를 흐려 만든 블룸 */
function makeLayer(seed, W, H, minW, maxW, minH, maxH, key, litAlpha) {
  const list = genSkyline(seed, W, minW, maxW, minH, maxH);
  const wins = [];
  for (const b of list) for (const w of b.wins) if (w.th <= 1) wins.push({ x: b.x + w.x, y: H - b.h + w.y, th: w.th, col: w.col });
  wins.sort((a, b) => a.th - b.th);
  const [lit, litG] = makeCanvas(W, H);
  const [h2, h2G] = makeCanvas(W / 2, H / 2);
  const [g4, g4G] = makeCanvas(W / 4, H / 4);
  const [g8, g8G] = makeCanvas(W / 8, H / 8);
  return {
    W, H, wins, ptr: 0, lit, litG, h2, h2G, g4, g4G, g8, g8G, litAlpha,
    imgs: PALS.map(p => renderSkyline(list, W, H, p[key], p[key + 'Sh'], p[key + 'Win']))
  };
}
const FAR = makeLayer(11, FAR_W, FAR_H, 16, 26, 60, 132, 'far', 0.8);
const NEAR = makeLayer(29, NEAR_W, NEAR_H, 18, 32, 34, 92, 'near', 1);

// 어두움 값이 변한 만큼만 창문을 켜거나 끈다 (정렬된 목록에서 포인터만 이동)
function updateLights(Ly, dark) {
  let dirty = false;
  while (Ly.ptr < Ly.wins.length && Ly.wins[Ly.ptr].th <= dark) {
    const w = Ly.wins[Ly.ptr++];
    Ly.litG.fillStyle = w.col; Ly.litG.fillRect(w.x, w.y, 2, 3);
    dirty = true;
  }
  while (Ly.ptr > 0 && Ly.wins[Ly.ptr - 1].th > dark) {
    const w = Ly.wins[--Ly.ptr];
    Ly.litG.clearRect(w.x, w.y, 2, 3);
    dirty = true;
  }
  if (!dirty) return;
  // 블룸: 켜진 창문 이미지를 1/2 → 1/4 → 1/8로 줄여 가며 부드럽게 흐린다
  const down = (g, src, w, h) => {
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    g.clearRect(0, 0, w, h); g.drawImage(src, 0, 0, w, h);
  };
  down(Ly.h2G, Ly.lit, Ly.W / 2, Ly.H / 2);
  down(Ly.g4G, Ly.h2, Ly.W / 4, Ly.H / 4);
  down(Ly.g8G, Ly.g4, Ly.W / 8, Ly.H / 8);
}

/* --- 덤불 --- */
const BUSH_W = 256, BUSH_H = 18;
function renderBushes(col, hi) {
  const [c, g] = makeCanvas(BUSH_W, BUSH_H);
  const r = mulberry(77);
  const disc = (cx, cy, rad, color) => {
    g.fillStyle = color;
    for (let y = -rad; y <= rad; y++) {
      const hw = Math.floor(Math.sqrt(rad * rad - y * y));
      g.fillRect(cx - hw, cy + y, hw * 2 + 1, 1);
    }
  };
  let x = 0;
  const blobs = [];
  while (x < BUSH_W) {
    const rad = 5 + Math.floor(r() * 6);
    blobs.push([x, rad]);
    x += rad + 2 + Math.floor(r() * 4);
  }
  for (const [bx, rad] of blobs) for (const o of [0, BUSH_W, -BUSH_W]) disc(bx + o, BUSH_H, rad, col);
  for (const [bx, rad] of blobs) for (const o of [0, BUSH_W, -BUSH_W]) disc(bx + o - 1, BUSH_H - rad + 2, Math.max(1, rad - 4), hi);
  return c;
}
for (const p of PALS) p.bushImg = renderBushes(p.bush, p.bushHi);

// 안개 구간용 검은 실루엣
function silhouette(img) {
  const [c, g] = makeCanvas(img.width, img.height);
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = '#000'; g.fillRect(0, 0, img.width, img.height);
  return c;
}
FAR.sil = silhouette(FAR.imgs[0]); NEAR.sil = silhouette(NEAR.imgs[0]);
const bushSil = silhouette(PALS[0].bushImg);

/* --- 흙 타일 --- */
const DIRT_W = 64, DIRT_H = 32;
const dirtImg = (() => {
  const [c, g] = makeCanvas(DIRT_W, DIRT_H);
  g.fillStyle = '#dcc07a';
  g.fillRect(0, 0, DIRT_W, DIRT_H);
  const r = mulberry(5);
  for (let i = 0; i < 46; i++) {
    g.fillStyle = r() < 0.6 ? '#c9a65e' : '#ead596';
    g.fillRect(Math.floor(r() * DIRT_W), Math.floor(r() * DIRT_H), r() < 0.3 ? 2 : 1, 1);
  }
  g.fillStyle = '#b98f4a';
  for (let i = 0; i < 7; i++) {
    const x = Math.floor(r() * (DIRT_W - 3)), y = Math.floor(r() * (DIRT_H - 2));
    g.fillRect(x, y, 2, 1); g.fillRect(x, y + 1, 1, 1);
  }
  return c;
})();

/* --- 별 --- */
const STARS = (() => {
  const r = mulberry(404), a = [];
  for (let i = 0; i < 70; i++) a.push({ fx: r(), fy: r() * 0.62, big: r() < 0.18, ph: r() * 6.28 });
  return a;
})();

/* --- 구름 --- */
const CLOUDS = (() => {
  const r = mulberry(8), a = [];
  for (let i = 0; i < 7; i++) a.push({ fx: (i + r() * 0.6) / 7, y: 40 + r() * 230, k: r() < 0.4 ? 1.5 : 1, sp: 0.1 + r() * 0.12 });
  return a;
})();

/* --- 사실적인 볼류메트릭 라이트 ---
   화면 공간 광산란(screen-space light scattering) 방식:
   1) 저해상도 버퍼에 광원의 빛을 그리고, 빛을 가리는 것(기둥·건물·주인공)을 지운다.
   2) 그 버퍼를 광원 중심으로 여러 번 확대하며 겹쳐 방사형 블러를 만든다.
   3) 결과를 화면에 가산 합성한다. → 가려진 틈으로 부드러운 빛기둥이 새어 나온다. */
const GR = 4;                                  // 빛 버퍼 1픽셀 = 4유닛
const [occCv, occCtx] = makeCanvas(2, 2);
const [blurCv, blurCtx] = makeCanvas(2, 2);
const [rayCv, rayCtx] = makeCanvas(2, 2);
const [histCv, histCtx] = makeCanvas(2, 2);    // 이전 프레임과 섞어 떨림을 없애는 누적 버퍼

// 건물 실루엣 마스크: 미리 부드럽게 줄여 두어야 스크롤될 때 빛이 깜빡이지 않는다
let maskFar = null, maskNear = null, maskVW = -1;
function buildMask(img, twU, thU) {
  const tw = twU / GR, th = thU / GR, n = Math.ceil(VW / GR / tw) + 1;
  const [c, g] = makeCanvas(n * tw, th);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.25;
  for (let i = 0; i < n; i++)
    for (const [ox, oy] of [[-0.5, -0.5], [0.5, -0.5], [-0.5, 0.5], [0.5, 0.5]]) g.drawImage(img, i * tw + ox, oy, tw, th);
  return c;
}

const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const ramp3 = (lo, mid, hi, t) => t < 0.5 ? mix3(lo, mid, t * 2) : mix3(mid, hi, t * 2 - 2 + 1);
const rgb = c => 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
const csv = c => Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]);

// 해: 오른쪽에서 떠서 호를 그리며 주인공 뒤를 지나 왼쪽 건물 뒤로 진다. 고도가 낮을수록 크고 붉어진다.
function sunLight(T) {
  const u = ((T - 0.86 + 1) % 1) / 0.5;
  if (u > 1.08) return { vis: false, weight: 0, k: 0, x: 0, y: 0, r: 1 };
  const x = VW * (0.88 - 0.86 * u), y = PLAY_H + 50 - Math.sin(Math.PI * Math.min(u, 1)) * PLAY_H * 0.78 + Math.max(0, u - 1) * 600;
  const e = smooth(clamp((PLAY_H - 170 - y) / 150, 0, 1));
  const r = lerp(44, 26, e);
  return {
    vis: true, sun: true, x, y, r, e,
    // 고도에 따른 색: 지평선 근처(일출·일몰)는 붉게 → 주황 → 가장 높을 때는 살짝 노란빛
    core: ramp3([255, 140, 96], [255, 200, 132], [255, 250, 214], e), rgb: ramp3([255, 78, 38], [255, 150, 62], [255, 226, 130], e),
    disc: ramp3([255, 92, 54], [255, 170, 84], [255, 236, 130], e), discHi: ramp3([255, 146, 96], [255, 208, 140], [255, 248, 196], e),
    k: lerp(0.68, 0.5, e), halo: lerp(400, 300, e), refl: lerp(0.6, 0.22, e),
    weight: smooth(clamp((PLAY_H + r - y) / 70, 0, 1))
  };
}
function moonLight(T) {
  const v = (T - 0.36) / 0.5;
  if (v < -0.04 || v > 1.04) return { vis: false, weight: 0, k: 0, x: 0, y: 0, r: 1 };
  const vc = clamp(v, 0, 1);
  const x = VW * (0.88 - 0.86 * v), y = PLAY_H + 50 - Math.sin(Math.PI * vc) * PLAY_H * 0.84 + Math.abs(v - vc) * 600;
  const em = smooth(clamp((PLAY_H - 170 - y) / 170, 0, 1));
  return {
    vis: true, sun: false, x, y, r: 24, e: em,
    // 뜨고 질 때는 살짝 푸르게, 가장 높을 때는 원래의 따뜻한 흰빛
    core: mix3([198, 220, 255], [236, 243, 255], em), rgb: mix3([104, 146, 255], [146, 182, 255], em),
    disc: mix3([176, 206, 255], [244, 241, 208], em), discHi: mix3([134, 166, 228], [213, 208, 166], em),
    k: 0.6, halo: 260, refl: 0.35,
    weight: smooth(clamp((PLAY_H + 24 - y) / 70, 0, 1))
  };
}

// 현재 시각의 색·광원을 한 번에 계산
function computeEnv() {
  const T = tod - Math.floor(tod);
  let i = 0;
  while (i < TIMELINE.length - 2 && T >= TIMELINE[i + 1][0]) i++;
  const [t0, a] = TIMELINE[i], [t1, b] = TIMELINE[i + 1];
  const f = a === b ? 0 : smooth(clamp((T - t0) / (t1 - t0), 0, 1));
  const A = PALS[a], B = PALS[b];
  const sun = sunLight(T), moon = moonLight(T);
  if (fogF > 0.001) {
    // 안개 구간: 달이 장면 바로 뒤에서 크게 비춘다 (역광)
    const F = fogF;
    if (!moon.vis) Object.assign(moon, moonLight(0.61));
    moon.x = lerp(moon.x, VW * 0.62, F); moon.y = lerp(moon.y, 215, F);
    moon.r = lerp(moon.r, 36, F); moon.e = lerp(moon.e, 1, F);
    moon.k = lerp(moon.k, 0.7, F); moon.halo = lerp(moon.halo, Math.max(520, VW * 0.6), F);
    moon.weight = lerp(moon.weight, 1, F); moon.refl *= 1 - F; moon.fog = F;
    moon.core = mix3(moon.core, [236, 243, 255], F); moon.rgb = mix3(moon.rgb, [150, 186, 255], F);
    sun.weight *= 1 - F;
  }
  return {
    T, a, b, f,
    sky: A.skyRGB.map((c, k) => rgb(mix3(c, B.skyRGB[k], f))),
    cloud: rgb(mix3(A.cloudRGB, B.cloudRGB, f)), cloudSh: rgb(mix3(A.cloudShRGB, B.cloudShRGB, f)),
    tintCol: rgb(mix3(A.tint, B.tint, f)), tintA: lerp(A.tint[3], B.tint[3], f),
    stars: lerp(A.stars, B.stars, f),
    sun, moon,
    light: sun.weight * (sun.k || 0) >= moon.weight * (moon.k || 0) ? sun : moon
  };
}

/* =========================================================================
   4. 밸런스
   -------------------------------------------------------------------------
   60Hz 고정 스텝. 주사율(60/90/120/144Hz)과 무관하게 같은 속도로 진행된다.
   ========================================================================= */
const STEP_MS = 1000 / 60;
const GRAVITY = 0.27;
const FLAP_V = -5.7;         // 점프 높이 약 60유닛
const MAX_FALL = 9.5;
const PIPE_W = 62, W_THIN = 44, W_WIDE = 108;   // 기둥 두께: 기본 / 얇은 쌍기둥 / 두꺼운 벽
const CAP_H = 26, CAP_OVER = 4;
const HIT_HW = 13, HIT_HH = 8;   // 캐릭터 판정 (보이는 것보다 약간 작게)
const FIRST_PIPE = 400;          // 시작 후 첫 장애물까지 거리 (어느 화면이든 동일)
const PIPE_MARGIN = 54;          // 틈이 천장/바닥에서 떨어져야 하는 최소 거리
const RETRY_DELAY = 40;          // 게임오버 직후 실수로 재시작되는 것을 막는 프레임

/* 난이도.  gap0→gap1: 틈 크기(기준선), sp0→sp1: 속도, ramp: 기준선이 최고에 도달하는 점수,
   move*: 움직이는 기둥, variety: 특수 패턴 비율, fog: 밤의 안개 구간 여부 */
const DIFFS = [
  { id: 'easy',   name: 'EASY',   col: '#7be06a', gap0: 204, gap1: 144, sp0: 2.28, sp1: 3.18, ramp: 46, moveFrom: 22, moveP: 0.24, amp: 18, variety: 0.85, fog: false },
  { id: 'normal', name: 'NORMAL', col: '#ffd23f', gap0: 188, gap1: 126, sp0: 2.45, sp1: 3.5,  ramp: 38, moveFrom: 14, moveP: 0.32, amp: 22, variety: 1,    fog: false },
  { id: 'hard',   name: 'HARD',   col: '#ff9a3d', gap0: 176, gap1: 116, sp0: 2.6,  sp1: 3.75, ramp: 32, moveFrom: 10, moveP: 0.38, amp: 24, variety: 1,    fog: true },
  { id: 'hell',   name: 'HELL',   col: '#ff4d5e', gap0: 164, gap1: 108, sp0: 2.8,  sp1: 4.1,  ramp: 24, moveFrom: 5,  moveP: 0.45, amp: 26, variety: 1,    fog: true }
];
const MIN_GAP = 100;                    // 어떤 경우에도 이보다 좁아지지 않는다 (물리적 한계 보호)
let diffIdx = 1;
try { const v = DIFFS.findIndex(d => d.id === localStorage.getItem('flappy_hero_diff2')); if (v >= 0) diffIdx = v; } catch (e) {}
let D = DIFFS[diffIdx];

/* 난이도 리듬 (모든 난이도 공통)
   판마다 "프레이즈"를 이어 붙여 긴장도 그래프를 만든다. 한 프레이즈는
     빌드업(3~6개, 점점 조임) → 클라이맥스(2~3개, 기준선을 넘는 가장 어려운 순간) → 휴식(2~4개, 확 풀림)
   으로 이루어지고 길이·높이가 매번 달라서 그래프가 불규칙하게 오르락내리락한다.
   클라이맥스의 shape는 1을 넘는다(1.05~1.3). 즉 EASY라도 잠깐은 EASY 기준선보다 어려운 구간이 나오고,
   HELL이라도 휴식 구간에서는 숨을 돌릴 수 있다. */
let track = [];
function shapeAt(n) {
  while (track.length <= n) {
    const quick = track.length > 8 && Math.random() < 0.25;          // 가끔은 짧고 급한 프레이즈
    const build = quick ? 2 : 3 + Math.floor(Math.random() * 4);
    const climax = quick ? 1 : 2 + Math.floor(Math.random() * 2);
    const rest = 2 + Math.floor(Math.random() * 3);
    const peak = 1.05 + Math.random() * 0.25, low = 0.22 + Math.random() * 0.22;
    for (let i = 0; i < build; i++) track.push(lerp(low + 0.18, 0.96, smooth((i + 1) / build)));
    for (let i = 0; i < climax; i++) track.push(peak);
    for (let i = 0; i < rest; i++) track.push(low);
  }
  return track[n];
}
const trendAt = n => Math.min(1, n / D.ramp);
const baseAt = n => 0.35 + 0.65 * trendAt(n);                       // 기준선: 처음부터 리듬이 느껴지도록 0.35에서 출발
const tensionAt = n => baseAt(n) * shapeAt(n);                      // 0(가장 쉬움) ~ 1(기준선 최고) ~ 1.3(클라이맥스)
const speedFor = n => D.sp0 + (D.sp1 - D.sp0) * trendAt(n) * (0.8 + 0.2 * Math.min(1, shapeAt(n)));
function gapFor(n) {
  const intro = n < 4 ? (4 - n) * 6 : 0;                                    // 처음 몇 개는 더 넓게
  return Math.max(MIN_GAP, Math.round(D.gap0 - (D.gap0 - D.gap1) * tensionAt(n) + intro));
}
const spacingFor = n => 236 + 34 * trendAt(n);
/* 안개 구간 (HARD·HELL 전용 기믹)
   밤마다 한 번, 안개 낀 지역을 지난다. 모든 것이 검은 실루엣이 되고 달빛 빛줄기와 그림자로만 길을 읽어야 한다.
   첫 밤은 기둥 4개, 이후 밤마다 1개씩 길어진다. 대신 구간 안에서는 틈이 조금 넓고 움직이는 기둥이 없다. */
const FOG_BASE_LEN = 4, FOG_MAX_LEN = 8, FOG_RAMP = 260, FOG_GAP_BONUS = 14;
const THEMES = {
  green:  { main: '#74c232', hi: '#b6ee62', hi2: '#93d948', sh: '#559a22', dk: '#3c7417' },
  copper: { main: '#d98a3c', hi: '#ffc77d', hi2: '#eda45a', sh: '#b0652a', dk: '#84451b' },
  aqua:    { main: '#3fb8c9', hi: '#a6f0f5', hi2: '#6fd6e2', sh: '#2a8fa3', dk: '#1b6577' },
  crimson: { main: '#d9506a', hi: '#ffa9b6', hi2: '#ee7a8e', sh: '#b0354f', dk: '#7f2238' },
  steel:  { main: '#8a7fd6', hi: '#cfc8ff', hi2: '#a79df0', sh: '#665bb4', dk: '#463d8a' }  // 움직이는 기둥
};

/* =========================================================================
   5. 게임 상태
   ========================================================================= */
let state = 'READY';         // READY | PLAYING | DYING | OVER
let paused = false;
let tick = 0;
let score = 0, shownScore = 0, scorePop = 0;
let newBest = false;
const bests = { easy: 0, normal: 0, hard: 0, hell: 0 };       // 난이도별 최고 기록
try {
  for (const d of DIFFS) bests[d.id] = parseInt(localStorage.getItem('flappy_hero_best2_' + d.id), 10) || 0;   // 난이도 기준이 바뀌어 기록 키를 새로 쓴다
} catch (e) {}
function setDiff(i) {
  if (i < 0 || i >= DIFFS.length || i === diffIdx) return;
  diffIdx = i; D = DIFFS[i]; track = [];
  try { localStorage.setItem('flappy_hero_diff2', D.id); } catch (e) {}
  tone('square', 520 + i * 130, 520 + i * 130, 0.07, 0.12);
}

let dist = 0, prevDist = 0;          // 게임 진행 거리 (판정용)
let scrollX = 0, prevScrollX = 0;    // 배경 스크롤 (연출용)
let pipes = [], pipeIndex = 0, lastWX = 0, lastC = PLAY_H * 0.45;
let overT = 0, shake = 0, flash = 0;
let autopilot = false, qualityLock = false;
let fog = null, fogCount = 0, fogDay = -1, fogF = 0;     // 안개 구간 {start, end}, 지금까지 지난 횟수, 화면에 적용 중인 세기
let tod = 0, todFF = false;         // 시간대 (정수부 = 지난 날 수), 재시작 시 아침까지 빨리 감기

const hero = { y: PLAY_H * 0.45, prevY: PLAY_H * 0.45, v: 0, rot: 0, prevRot: 0 };
const particles = [], ghosts = [], lines = [];

function resetGame() {
  state = 'READY';
  score = 0; shownScore = 0; scorePop = 0; newBest = false;
  dist = prevDist = 0;
  pipes = []; pipeIndex = 0; lastWX = 0; lastC = PLAY_H * 0.45;
  pat = { type: 'rand', left: 0, i: 0 }; lastW = PIPE_W; lastGap = 200; track = [];
  hero.y = hero.prevY = PLAY_H * 0.45; hero.v = 0; hero.rot = hero.prevRot = 0;
  particles.length = ghosts.length = lines.length = 0;
  overT = 0; shake = 0; flash = 0;
  if (tod - Math.floor(tod) > 0.01) todFF = true;
  fog = null; fogCount = 0; fogDay = -1;
}

/* 장애물 패턴
   기둥을 하나씩 무작위로 놓는 대신, 2~5개짜리 "패턴"을 이어 붙인다. 패턴마다 간격·두께·높이 변화가 달라
   리듬이 계속 바뀐다. 어떤 패턴이든 이전 틈에서 물리적으로 닿을 수 있는 범위(maxD) 안에서만 배치된다.
     rand   : 완전 무작위 (간격도 들쭉날쭉)
     stairs : 계단 - 한 방향으로 일정하게 오르내림, 촘촘한 간격
     zigzag : 지그재그 - 위아래를 크게 번갈아
     tunnel : 터널 - 같은 높이의 기둥 3개가 바짝 붙음
     leap   : 도약 - 긴 간격 뒤에 닿을 수 있는 한계까지 높이 변화
     wide   : 두꺼운 벽 - 오래 버텨야 하는 긴 통로
     pair   : 얇은 쌍기둥 - 아주 가까운 두 개, 높이가 살짝 어긋남 */
const PLAIN = ['green', 'copper', 'aqua', 'crimson'];
const PATTERNS = [['rand', 3], ['stairs', 2], ['zigzag', 2], ['tunnel', 1.5], ['leap', 1.3], ['wide', 1.3], ['pair', 1.3]];
let pat = { type: 'rand', left: 0, i: 0 }, lastW = PIPE_W, lastGap = 200;
const rnd = (a, b) => a + Math.random() * (b - a);
function nextPattern(n) {
  const theme = PLAIN[Math.floor(Math.random() * PLAIN.length)];
  if (n < 4) return { type: 'rand', left: 4 - n, i: 0, theme: null };          // 시작 구간은 단순하게
  let type = 'rand';
  if (shapeAt(n) > 0.5 && Math.random() < D.variety) {                         // 휴식 구간은 단순한 배치로
    const opts = PATTERNS.filter(o => o[0] !== pat.type);                      // 같은 패턴이 연달아 나오지 않게
    let r = Math.random() * opts.reduce((a, o) => a + o[1], 0);
    for (const o of opts) { r -= o[1]; if (r <= 0) { type = o[0]; break; } }
  }
  const dir = Math.random() < 0.5 ? -1 : 1;
  switch (type) {
    case 'stairs': return { type, left: 3 + (Math.random() < 0.5 ? 1 : 0), i: 0, theme, dir, step: rnd(55, 90) };
    case 'zigzag': return { type, left: 3 + Math.floor(Math.random() * 3), i: 0, theme, dir, step: rnd(0.72, 0.95) };
    case 'tunnel': return { type, left: 3, i: 0, theme };
    case 'leap':   return { type, left: 1, i: 0, theme };
    case 'wide':   return { type, left: Math.random() < 0.35 ? 2 : 1, i: 0, theme };
    case 'pair':   return { type, left: 2, i: 0, theme, dir };
    default:       return { type: 'rand', left: 2 + Math.floor(Math.random() * 3), i: 0, theme: null };
  }
}

function spawnPipe() {
  const n = pipeIndex++;
  if (pat.left <= 0) pat = nextPattern(n);
  const first = pat.i === 0;
  pat.i++; pat.left--;

  // 틈 크기: 난이도 곡선 + 기둥마다 약간의 편차
  let gap = Math.max(gapFor(n) + Math.round(rnd(-4, 10)), MIN_GAP);
  let sm = rnd(0.9, 1.2), w = PIPE_W;
  switch (pat.type) {
    case 'stairs': sm = 0.86; break;
    case 'zigzag': sm = 1.02; break;
    case 'tunnel': sm = first ? 1.1 : 0.7; gap += 8; break;
    case 'leap':   sm = 1.32; break;
    case 'wide':   w = W_WIDE; sm = 1.15; gap += 12; break;
    case 'pair':   w = W_THIN; sm = first ? 1.08 : 0.6; break;
  }
  // 간격: 직전 기둥을 빠져나온 뒤 최소한의 여유(108)는 항상 보장
  const spacing = Math.max(spacingFor(n) * sm + (lastW - PIPE_W), lastW + 108);
  const wx = n === 0 ? dist + FIRST_PIPE : lastWX + spacing;
  const inFog = fog && n >= fog.firstN && n <= fog.lastN;
  if (inFog) gap += FOG_GAP_BONUS;
  const moving = !inFog && w === PIPE_W && (pat.type === 'rand' || pat.type === 'leap') && shapeAt(n) > 0.5 && n >= D.moveFrom && Math.random() < D.moveP * 1.6;
  const amp = moving ? D.amp * rnd(0.7, 1.15) : 0;
  if (moving) gap = Math.max(gap, Math.round(110 + amp));          // 움직이는 기둥은 흔들리는 만큼 여유를 둔다

  // 이전 틈에서 물리적으로 여유 있게 도달할 수 있는 범위 안에서만 다음 틈을 놓는다
  const travel = (spacing - lastW) / speedFor(n);
  const maxD = n < 3 ? 80 : Math.min(travel * 2.1, 230);
  let lo = PIPE_MARGIN + gap / 2 + amp;
  let hi = PLAY_H - PIPE_MARGIN - gap / 2 - amp;
  const lo0 = lo, hi0 = hi;
  // 내려가는 쪽은 더 엄격하다: 직전 기둥을 빠져나오며 날갯짓했다면 한동안은 오히려 떠오르기 때문.
  // (날갯짓 직후 t프레임 뒤의 높이 변화 = 0.135t² - 5.7t) + 두 틈 안에서 쓸 수 있는 여유분만큼만 허용한다.
  const slack = 0.6 * ((lastGap + gap) / 2 - HIT_HH * 2) - 6;
  const maxDown = n < 3 ? 80 : clamp(GRAVITY / 2 * travel * travel + FLAP_V * travel + slack, 0, maxD);
  lo = Math.max(lo, lastC - maxD);
  hi = Math.min(hi, lastC + maxDown);
  if (lo > hi) lo = hi = clamp(lastC, lo0, hi0);
  let c;
  switch (pat.type) {
    case 'stairs':
      c = lastC + pat.dir * pat.step;
      if (c < lo0 || c > hi0) { pat.dir *= -1; c = lastC + pat.dir * pat.step; }
      break;
    case 'zigzag':
      if (lastC + pat.dir * 40 < lo0 || lastC + pat.dir * 40 > hi0) pat.dir *= -1;
      c = lastC + pat.dir * pat.step * maxD; pat.dir *= -1;
      break;
    case 'tunnel': c = first ? rnd(lo, hi) : lastC + rnd(-8, 8); break;
    case 'leap':   c = lastC - lo > hi - lastC ? lo + (hi - lo) * 0.04 : hi - (hi - lo) * 0.04; break;
    case 'pair':   c = first ? rnd(lo, hi) : (lastC - 46 < lo0 ? lastC + rnd(0, 30) : lastC - rnd(22, 46)); break;
    default:       c = rnd(lo, hi);
  }
  c = clamp(c, lo, hi);

  pipes.push({
    n, wx, w, c, gap, amp, sp: rnd(0.03, 0.055), ph: Math.random() * 6.28, pt: pat.type, dc: Math.round(c - lastC), tr: Math.round(travel),
    theme: moving ? 'steel' : (pat.theme || PLAIN[Math.floor(Math.random() * PLAIN.length)]),
    passed: false
  });
  if (fog && n === fog.lastN) fog.end = wx + w + 50;
  lastWX = wx; lastC = c; lastW = w; lastGap = gap;
}
const pipeCenter = p => p.amp ? p.c + Math.sin(tick * p.sp + p.ph) * p.amp : p.c;

const fogAt = d => !fog ? 0 :
  smooth(clamp((d - (fog.start - FOG_RAMP)) / FOG_RAMP, 0, 1)) * (1 - smooth(clamp((d - fog.end) / FOG_RAMP, 0, 1)));

function startFog() {
  // 아직 화면에 보이지 않는 기둥부터 안개 구간으로 만든다
  const start = dist + Math.max(320, VW - heroX + 80);
  let first = pipes.find(p => p.wx >= start), n, wx;
  if (first) { n = first.n; wx = first.wx; } else { n = pipeIndex; wx = lastWX + spacingFor(n); }
  const T = tod - Math.floor(tod);
  const room = Math.floor(((0.70 - T) * DAY_LEN - (wx - dist)) / 262);            // 밤이 끝나기 전에 끝나도록
  const len = clamp(Math.min(FOG_BASE_LEN + fogCount, FOG_MAX_LEN, room), 3, FOG_MAX_LEN);
  fog = { start: wx - 150, end: Infinity, firstN: n, lastN: n + len - 1, len };     // end는 마지막 기둥이 생성될 때 확정
  for (const p of pipes) if (p.n >= fog.firstN && p.n <= fog.lastN) {
    p.gap += FOG_GAP_BONUS; p.amp = 0; if (p.theme === 'steel') p.theme = 'green';
    if (p.n === fog.lastN) fog.end = p.wx + p.w + 50;
  }
  fogCount++;
  tone('sine', 196, 147, 0.9, 0.14); tone('sine', 294, 220, 0.9, 0.08, 0.05);
}

function flap() {
  hero.v = FLAP_V;
  sfx.flap();
  for (let i = 0; i < 3; i++)
    lines.push({ x: heroX - 14, y: hero.y - 8 + Math.random() * 16, len: 16 + Math.random() * 22, sp: 5 + Math.random() * 5, a: 0.7 });
  for (let i = 0; i < 5; i++)
    particles.push({
      x: heroX - 18, y: hero.y + 2 + Math.random() * 6, vx: -(1.5 + Math.random() * 2.5), vy: 0.5 + Math.random() * 1.8,
      life: 1, decay: 0.05 + Math.random() * 0.04, size: 4, color: Math.random() < 0.5 ? '#ffd23f' : '#ff8a2a', g: 0
    });
}

function die(onGround) {
  if (state !== 'PLAYING') return;
  sfx.hit();
  shake = 10; flash = 1;
  if (score > bests[D.id]) {
    bests[D.id] = score; newBest = true;
    try { localStorage.setItem('flappy_hero_best2_' + D.id, String(score)); } catch (e) {}
  }
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * 6.28, sp = 1.5 + Math.random() * 3.5;
    particles.push({
      x: heroX, y: hero.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
      life: 1, decay: 0.03 + Math.random() * 0.03, size: Math.random() < 0.5 ? 4 : 2,
      color: ['#ffffff', '#ffd23f', '#e8408f', '#19b5a5'][i % 4], g: 0.15
    });
  }
  if (onGround) land(); else { state = 'DYING'; hero.v = -3.5; sfx.fall(); }
}
function land() {
  state = 'OVER'; overT = 0;
  hero.y = PLAY_H - HIT_HH; hero.v = 0;
  sfx.thud();
  if (newBest) sfx.best();
  shake = Math.max(shake, 6);
  for (let i = 0; i < 10; i++)
    particles.push({
      x: heroX - 12 + Math.random() * 24, y: PLAY_H - 2, vx: (Math.random() - 0.5) * 4, vy: -(0.5 + Math.random() * 2),
      life: 1, decay: 0.04, size: 4, color: i % 2 ? '#ead596' : '#c9a65e', g: 0.1
    });
}

/* =========================================================================
   6. 업데이트 (고정 60Hz)
   ========================================================================= */
function step() {
  tick++;
  prevDist = dist; prevScrollX = scrollX; hero.prevY = hero.y; hero.prevRot = hero.rot;

  if (shake > 0) shake *= 0.86;
  if (shake < 0.3) shake = 0;
  if (flash > 0) flash = Math.max(0, flash - 0.08);
  if (scorePop > 0) scorePop = Math.max(0, scorePop - 0.1);

  let spd = 0;
  if (state === 'READY') {
    spd = 1.4;
    hero.y = PLAY_H * 0.45 + Math.sin(tick * 0.08) * 7;
    hero.rot = Math.sin(tick * 0.08 + 1.2) * 0.06;
  } else if (state === 'PLAYING') {
    spd = speedFor(score);
    dist += spd;

    if (autopilot) {      // 자동 테스트용
      const np = pipes.find(q => q.wx + q.w > dist - HIT_HW - 1);
      const tgt = np ? pipeCenter(np) + np.gap / 2 - 26 : 250;
      if (hero.y > tgt && hero.v > -1) flap();
    }
    hero.v = Math.min(hero.v + GRAVITY, MAX_FALL);
    hero.y += hero.v;
    if (hero.y < HIT_HH + 2) { hero.y = HIT_HH + 2; hero.v = 0; }
    hero.rot = lerp(hero.rot, clamp(hero.v * 0.075, -0.42, 1.05), 0.22);

    // 안개 구간: HARD에서 밤이 깊어지면 시작
    if (D.fog && !fog && !todFF) {
      const day = Math.floor(tod), T = tod - day;
      if (T >= 0.44 && T < 0.56 && fogDay !== day) { fogDay = day; startFog(); }
    }
    if (fog && dist > fog.end + FOG_RAMP + 10) fog = null;

    while (pipes.length === 0 || lastWX - dist + heroX < VW + 120) spawnPipe();

    for (let i = 0; i < pipes.length; i++) {
      const p = pipes[i];
      if (dist + HIT_HW > p.wx - 2 && dist - HIT_HW < p.wx + p.w + 2) {
        const c = pipeCenter(p);
        if (hero.y - HIT_HH < c - p.gap / 2 || hero.y + HIT_HH > c + p.gap / 2) { die(false); break; }
      }
      if (!p.passed && p.wx + p.w < dist - HIT_HW) {
        p.passed = true;
        score++; scorePop = 1;
        sfx.score();
      }
      if (p.wx - dist + heroX < -p.w - 40) { pipes.splice(i, 1); i--; }
    }
    if (state === 'PLAYING' && hero.y + HIT_HH >= PLAY_H) die(true);

    if (state === 'PLAYING') {
      if (tick % 5 === 0) ghosts.push({ x: heroX, y: hero.y, rot: hero.rot, a: 0.3 });
      if (tick % 3 === 0)
        particles.push({
          x: heroX - 20, y: hero.y + 4 + Math.random() * 4, vx: -(1 + Math.random() * 1.5), vy: (Math.random() - 0.5) * 0.8,
          life: 1, decay: 0.07, size: 2, color: '#ffe9a8', g: 0
        });
    }
  } else if (state === 'DYING') {
    hero.v = Math.min(hero.v + GRAVITY * 1.4, 13);
    hero.y += hero.v;
    hero.rot += 0.28;
    if (hero.y + HIT_HH >= PLAY_H) land();
  } else if (state === 'OVER') {
    overT++;
    hero.rot = lerp(hero.rot, Math.round(hero.rot / Math.PI) * Math.PI + 0.25, 0.3);
    if (overT > 14 && shownScore < score) shownScore += Math.max(1, Math.ceil((score - shownScore) / 8));
  }
  scrollX += spd;

  // 시간의 흐름: 비행한 거리만큼 해가 움직인다
  if (todFF) {
    const next = Math.floor(tod) + 1;
    tod += 0.006;
    if (tod >= next) { tod = next; todFF = false; }
  } else if (state === 'PLAYING') tod += spd / DAY_LEN;
  const dark = darkness(tod - Math.floor(tod));
  updateLights(FAR, dark); updateLights(NEAR, dark);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx - (state === 'PLAYING' ? spd * 0.3 : 0); p.y += p.vy; p.vy += p.g; p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = ghosts.length - 1; i >= 0; i--) {
    const g = ghosts[i];
    g.x -= 2.2; g.a -= 0.035;
    if (g.a <= 0) ghosts.splice(i, 1);
  }
  for (let i = lines.length - 1; i >= 0; i--) {
    const l = lines[i];
    l.x -= l.sp; l.a -= 0.05;
    if (l.a <= 0) lines.splice(i, 1);
  }
}

/* =========================================================================
   7. 렌더링
   ========================================================================= */
const R = v => Math.round(v * S) / S;        // 기기 픽셀에 스냅

function tile(img, offset, y, w, h) {
  let x = -(((offset % w) + w) % w);
  const ow = w + 1 / S;
  for (; x < VW; x += w) ctx.drawImage(img, R(x), y, ow, h);
}
function disc(cx, cy, r, color, px) {
  ctx.fillStyle = color;
  for (let y = -r; y < r; y += px) {
    const hw = Math.floor(Math.sqrt(r * r - (y + px / 2) * (y + px / 2)) / px) * px;
    if (hw > 0) ctx.fillRect(cx - hw, cy + y, hw * 2, px);
  }
}

function drawBody(lt) {
  const cx = Math.round(lt.x / 2) * 2, cy = Math.round(lt.y / 2) * 2, r = Math.round(lt.r / 2) * 2;
  if (lt.sun) {
    ctx.globalAlpha = 0.3; disc(cx, cy, r + 12, rgb(lt.discHi), 2);
    ctx.globalAlpha = 1; disc(cx, cy, r, rgb(lt.disc), 2); disc(cx - 4, cy - 4, Math.round(r * 0.3) * 2, rgb(lt.discHi), 2);
  } else {
    ctx.globalAlpha = 0.18; disc(cx, cy, r + 12, '#cfd8ff', 2);
    ctx.globalAlpha = 1; disc(cx, cy, r, rgb(lt.disc), 2);
    ctx.fillStyle = rgb(lt.discHi);
    ctx.fillRect(cx - 12, cy - 8, 6, 6); ctx.fillRect(cx + 4, cy + 2, 8, 6); ctx.fillRect(cx - 4, cy + 10, 4, 4);
  }
}
function drawLayer(Ly, off, env) {
  const y = PLAY_H - Ly.H * 2 + 2, w = Ly.W * 2, h = Ly.H * 2;
  tile(Ly.imgs[env.a], off, y, w, h);
  if (env.f > 0.003) { ctx.globalAlpha = env.f; tile(Ly.imgs[env.b], off, y, w, h); ctx.globalAlpha = 1; }
  if (Ly.ptr > 0) {
    // 켜진 창문 + 번지는 불빛(블룸)
    ctx.globalAlpha = Ly.litAlpha;
    tile(Ly.lit, off, y, w, h);
    ctx.imageSmoothingEnabled = true;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Ly.litAlpha;       tile(Ly.g4, off, y, w, h);
    ctx.globalAlpha = Ly.litAlpha * 0.9; tile(Ly.g8, off, y, w, h);
    ctx.globalCompositeOperation = 'source-over';
    ctx.imageSmoothingEnabled = false;
    ctx.globalAlpha = 1;
  }
}
const FOG_BASE = 'rgb(13,18,38)', FOG_HAZE = 'rgb(44,56,94)';
// 레이어 사이에 낀 안개: 옅은 연무 + 달빛에 빛나는 안개(빛줄기 버퍼)를 한 겹 덮는다.
// 뒤에 있는 레이어일수록 여러 겹이 쌓여 흐려지므로 거리감이 생긴다.
function fogVeil(haze, glow) {
  ctx.globalAlpha = fogF * haze; ctx.fillStyle = FOG_HAZE;
  ctx.fillRect(0, 0, VW, PLAY_H);
  ctx.globalAlpha = 1;
  compositeRays(fogF * glow);
}
function drawSky(sx, env) {
  const F = fogF;
  // 하늘: 계단식 그라데이션
  const bands = env.sky, bh = PLAY_H / bands.length;
  for (let i = 0; i < bands.length; i++) {
    ctx.fillStyle = bands[i];
    ctx.fillRect(0, i * bh - 0.5, VW, bh + 1);
  }
  // 별
  if (env.stars * (1 - F) > 0.01) {
    ctx.fillStyle = '#ffffff';
    for (const s of STARS) {
      ctx.globalAlpha = env.stars * (1 - F) * (0.55 + 0.45 * Math.sin(tick * 0.05 + s.ph));
      const sz = s.big ? 4 : 2;
      ctx.fillRect(Math.round(s.fx * VW / 2) * 2, Math.round(s.fy * PLAY_H / 2) * 2, sz, sz);
    }
    ctx.globalAlpha = 1;
  }
  if (F > 0.001) { ctx.globalAlpha = F * 0.94; ctx.fillStyle = FOG_BASE; ctx.fillRect(0, 0, VW, PLAY_H); ctx.globalAlpha = 1; }
  // 해와 달
  for (const lt of [env.moon, env.sun]) {
    if (!lt.vis || lt.y - lt.r * 5 > PLAY_H) continue;
    drawBody(lt);
    drawBloom(lt);
  }
  // 구름
  if (F < 0.99) {
    const span = VW + 260, top = safe.t;
    ctx.globalAlpha = 1 - F;
    for (const c of CLOUDS) {
      const x = R((((c.fx * span - sx * c.sp) % span) + span) % span - 130), y = c.y + top * 0.5, k = c.k;
      ctx.fillStyle = env.cloudSh;
      ctx.fillRect(x + 4 * k, y + 26 * k, 66 * k, 4 * k);
      ctx.fillStyle = env.cloud;
      ctx.fillRect(x, y + 12 * k, 74 * k, 16 * k);
      ctx.fillRect(x + 10 * k, y + 4 * k, 50 * k, 10 * k);
      ctx.fillRect(x + 22 * k, y - 4 * k, 26 * k, 10 * k);
    }
    ctx.globalAlpha = 1;
  }
  // 스카이라인 2겹 + 덤불 (안개 구간에서는 검은 실루엣 + 레이어 사이 안개)
  const sil = (img, off, y, w, h) => { ctx.globalAlpha = F; tile(img, off, y, w, h); ctx.globalAlpha = 1; };
  drawLayer(FAR, sx * 0.18, env);
  if (F > 0.001) { sil(FAR.sil, sx * 0.18, PLAY_H - FAR_H * 2 + 2, FAR_W * 2, FAR_H * 2); fogVeil(0.3, 0.26); }
  drawLayer(NEAR, sx * 0.38, env);
  if (F > 0.001) { sil(NEAR.sil, sx * 0.38, PLAY_H - NEAR_H * 2 + 2, NEAR_W * 2, NEAR_H * 2); fogVeil(0.2, 0.16); }
  const by = PLAY_H - BUSH_H * 2;
  tile(PALS[env.a].bushImg, sx * 0.62, by, BUSH_W * 2, BUSH_H * 2);
  if (env.f > 0.003) { ctx.globalAlpha = env.f; tile(PALS[env.b].bushImg, sx * 0.62, by, BUSH_W * 2, BUSH_H * 2); ctx.globalAlpha = 1; }
  if (F > 0.001) { sil(bushSil, sx * 0.62, by, BUSH_W * 2, BUSH_H * 2); fogVeil(0.1, 0.08); }
}

let PW = PIPE_W;        // 지금 그리는 기둥의 두께
function pipePart(x, y, h, t, isCap) {
  if (h <= 0) return;
  const w = isCap ? PW + CAP_OVER * 2 : PW;
  if (isCap) x -= CAP_OVER;
  ctx.fillStyle = INK;      ctx.fillRect(x, y, w, h);
  const ix = x + 3, iw = w - 6, iy = isCap ? y + 3 : y, ih = isCap ? h - 6 : h;
  ctx.fillStyle = t.main;   ctx.fillRect(ix, iy, iw, ih);
  ctx.fillStyle = t.hi2;    ctx.fillRect(ix, iy, 4, ih);
  ctx.fillStyle = t.hi;     ctx.fillRect(ix + 6, iy, 6, ih);
  ctx.fillStyle = t.hi2;    ctx.fillRect(ix + 14, iy, 2, ih);
  ctx.fillStyle = t.sh;     ctx.fillRect(ix + iw - 16, iy, 10, ih);
  ctx.fillStyle = t.dk;     ctx.fillRect(ix + iw - 6, iy, 6, ih);
  if (isCap) {
    ctx.fillStyle = t.hi;   ctx.fillRect(ix, iy, iw - 6, 2);
    ctx.fillStyle = t.dk;   ctx.fillRect(ix, iy + ih - 2, iw, 2);
  }
}
function drawPipes(camX, tintCol, tintA) {
  for (const p of pipes) {
    const x = R(p.wx - camX + heroX);
    if (x > VW + 10 || x < -p.w - 10) continue;
    const t = THEMES[p.theme];
    PW = p.w;
    const c = pipeCenter(p);
    const top = Math.round(c - p.gap / 2), bot = Math.round(c + p.gap / 2);
    // 위 기둥: 화면 맨 위(노치 포함)까지 이어진다
    pipePart(x, -4, top - CAP_H + 4, t, false);
    ctx.fillStyle = t.dk; ctx.fillRect(x + 3, top - CAP_H - 4, p.w - 6, 4);
    pipePart(x, top - CAP_H, CAP_H, t, true);
    // 아래 기둥
    pipePart(x, bot + CAP_H, PLAY_H - bot - CAP_H, t, false);
    ctx.fillStyle = t.dk; ctx.fillRect(x + 3, bot + CAP_H, p.w - 6, 4);
    pipePart(x, bot, CAP_H, t, true);
    if (p.amp) {    // 움직이는 기둥 표시등
      ctx.fillStyle = (tick >> 3) & 1 ? '#fff27a' : '#ff5d8f';
      ctx.fillRect(x + p.w / 2 - 3, top - 16, 6, 6);
      ctx.fillRect(x + p.w / 2 - 3, bot + 10, 6, 6);
    }
    if (tintA > 0) {
      ctx.globalAlpha = tintA; ctx.fillStyle = tintCol;
      ctx.fillRect(x, -4, p.w, top - CAP_H + 4);
      ctx.fillRect(x - CAP_OVER, top - CAP_H, p.w + CAP_OVER * 2, CAP_H);
      ctx.fillRect(x - CAP_OVER, bot, p.w + CAP_OVER * 2, CAP_H);
      ctx.fillRect(x, bot + CAP_H, p.w, PLAY_H - bot - CAP_H);
      ctx.globalAlpha = 1;
    }
  }
}

// 광원 주변의 블룸(번짐). 건물·기둥보다 뒤에 그려 실루엣이 살아나게 한다.
function drawBloom(lt) {
  const R0 = lt.r * 5;
  const g = ctx.createRadialGradient(lt.x, lt.y, 0, lt.x, lt.y, R0);
  const a0 = lerp(0.4, 1, lt.e);            // 낮게 뜬 해·달은 중심이 하얗게 날아가지 않게 해서 본래 색을 살린다
  g.addColorStop(0, 'rgba(' + csv(lt.core) + ',' + a0 + ')');
  g.addColorStop(0.16, 'rgba(' + csv(lt.core) + ',' + a0 * 0.9 + ')');
  g.addColorStop(0.3, 'rgba(' + csv(lt.rgb) + ',0.5)');
  g.addColorStop(0.6, 'rgba(' + csv(lt.rgb) + ',0.14)');
  g.addColorStop(1, 'rgba(' + csv(lt.rgb) + ',0)');
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = Math.min(1, lt.k * 1.2);
  ctx.fillStyle = g;
  ctx.fillRect(lt.x - R0, lt.y - R0, R0 * 2, Math.min(R0 * 2, PLAY_H - (lt.y - R0)));
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function computeRays(lt, camX, hy, hr, sx) {
  if (!fxRays) return;
  const w = Math.ceil(VW / GR) + 1, h = Math.ceil(PLAY_H / GR);
  for (const c of [occCv, blurCv, rayCv, histCv]) if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  if (maskVW !== VW) {
    maskVW = VW;
    maskFar = buildMask(FAR.imgs[0], FAR_W * 2, FAR_H * 2);
    maskNear = buildMask(NEAR.imgs[0], NEAR_W * 2, NEAR_H * 2);
  }
  const mod = (v, m) => ((v % m) + m) % m;

  // 1) 광원 + 차폐물 (모두 부드러운 가장자리로 그려 서브픽셀 이동에도 값이 튀지 않게 한다)
  let g = occCtx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
  g.clearRect(0, 0, w, h);
  if (lt.weight > 0.004) {
    const lx = lt.x, ly = lt.y;
    g.setTransform(1 / GR, 0, 0, 1 / GR, 0, 0);
    const grad = g.createRadialGradient(lx, ly, 0, lx, ly, lt.halo);
    grad.addColorStop(0, 'rgba(' + csv(lt.core) + ',1)');
    grad.addColorStop(lt.r / lt.halo, 'rgba(' + csv(lt.core) + ',1)');
    const fg = lt.fog || 0;                                        // 안개 속에서는 빛이 멀리까지 퍼진다
    grad.addColorStop(lt.r * 2 / lt.halo, 'rgba(' + csv(lt.rgb) + ',' + (0.55 - 0.1 * fg) + ')');
    grad.addColorStop(0.5, 'rgba(' + csv(lt.rgb) + ',' + (0.12 - 0.02 * fg) + ')');
    grad.addColorStop(1, 'rgba(' + csv(lt.rgb) + ',0)');
    g.fillStyle = grad;
    g.globalAlpha = lt.weight;
    g.fillRect(lx - lt.halo, ly - lt.halo, lt.halo * 2, lt.halo * 2);

    g.globalCompositeOperation = 'destination-out';
    g.imageSmoothingEnabled = true;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 0.8;                                           // 먼 건물은 대기에 살짝 묻힌다
    g.drawImage(maskFar, -mod(sx * 0.18, FAR_W * 2) / GR, (PLAY_H - FAR_H * 2 + 2) / GR);
    g.globalAlpha = 1;
    g.drawImage(maskNear, -mod(sx * 0.38, NEAR_W * 2) / GR, (PLAY_H - NEAR_H * 2 + 2) / GR);

    g.setTransform(1 / GR, 0, 0, 1 / GR, 0, 0);
    g.fillStyle = '#000';
    for (const p of pipes) {
      const x = p.wx - camX + heroX;
      if (x > VW + 20 || x < -p.w - 20) continue;
      const c = pipeCenter(p), top = c - p.gap / 2, bot = c + p.gap / 2;
      g.fillRect(x, -10, p.w, top - CAP_H + 10);
      g.fillRect(x - CAP_OVER, top - CAP_H, p.w + CAP_OVER * 2, CAP_H);
      g.fillRect(x - CAP_OVER, bot, p.w + CAP_OVER * 2, CAP_H);
      g.fillRect(x, bot + CAP_H, p.w, PLAY_H - bot - CAP_H + 10);
    }
    g.save();
    g.translate(heroX, hy); g.rotate(hr);
    g.drawImage(heroSprite, -HERO_W / 2, -HERO_H / 2, HERO_W, HERO_H);
    g.fillRect(-30, -9, 36, 8);                                   // 망토
    g.restore();

    // 2) 방사형 블러: 1차(촘촘하게) → 2차(멀리)
    const cx = lx / GR, cy = ly / GR;
    g = blurCtx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-over';
    g.clearRect(0, 0, w, h);
    g.globalCompositeOperation = 'lighter';
    g.imageSmoothingEnabled = true;
    const N1 = 8;
    g.globalAlpha = 1 / N1;
    for (let i = 0; i < N1; i++) {
      const k = 1 + i * 0.028;
      g.setTransform(k, 0, 0, k, cx * (1 - k), cy * (1 - k));
      g.drawImage(occCv, 0, 0);
    }
    g = rayCtx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-over';
    g.clearRect(0, 0, w, h);
    g.globalCompositeOperation = 'lighter';
    g.imageSmoothingEnabled = true;
    const N2 = 8, DEC = 0.87;
    let sum = 0;
    for (let j = 0; j < N2; j++) sum += Math.pow(DEC, j);
    for (let j = 0; j < N2; j++) {
      const k = Math.pow(1.26, j);
      g.globalAlpha = Math.pow(DEC, j) / sum * lt.k * 1.3;
      g.setTransform(k, 0, 0, k, cx * (1 - k), cy * (1 - k));
      g.drawImage(blurCv, 0, 0);
    }
  } else {
    rayCtx.setTransform(1, 0, 0, 1, 0, 0);
    rayCtx.globalCompositeOperation = 'source-over';
    rayCtx.clearRect(0, 0, w, h);
  }

  // 3) 시간축 안정화: 새 결과를 이전 프레임들과 섞는다 (hist = hist*0.6 + new*0.4)
  g = histCtx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'destination-out';
  g.globalAlpha = 0.4; g.fillStyle = '#000';
  g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'lighter';
  g.drawImage(rayCv, 0, 0);

}
// 계산해 둔 빛줄기를 화면에 얹는다 (안개 구간에서는 레이어마다 여러 번 호출된다)
function compositeRays(a) {
  if (a <= 0.004) return;
  if (!fxRays) {
    // 저사양 폴백: 빛줄기 계산이 꺼져 있어도 안개 구간에서는 달빛 번짐으로 실루엣이 보이게 한다
    if (fogF <= 0.001) return;
    const R0 = Math.max(VW, PLAY_H) * 0.8, g = ctx.createRadialGradient(VW * 0.62, 215, 0, VW * 0.62, 215, R0);
    g.addColorStop(0, 'rgba(210,225,255,0.9)'); g.addColorStop(0.4, 'rgba(150,186,255,0.4)'); g.addColorStop(1, 'rgba(150,186,255,0.08)');
    ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = a * fogF; ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, PLAY_H);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    return;
  }
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = a;
  ctx.drawImage(histCv, 0, 0, histCv.width * GR, histCv.height * GR);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.imageSmoothingEnabled = false;
}
// 안개 구간: 기둥을 검은 실루엣으로 덮는다
function blackPipes(camX, a) {
  if (a <= 0.004) return;
  ctx.globalAlpha = a; ctx.fillStyle = '#000';
  for (const p of pipes) {
    const x = R(p.wx - camX + heroX);
    if (x > VW + 10 || x < -p.w - 10) continue;
    const c = pipeCenter(p), top = Math.round(c - p.gap / 2), bot = Math.round(c + p.gap / 2);
    ctx.fillRect(x, -4, p.w, top - CAP_H + 4);
    ctx.fillRect(x - CAP_OVER, top - CAP_H, p.w + CAP_OVER * 2, CAP_H);
    ctx.fillRect(x - CAP_OVER, bot, p.w + CAP_OVER * 2, CAP_H);
    ctx.fillRect(x, bot + CAP_H, p.w, PLAY_H - bot - CAP_H);
  }
  ctx.globalAlpha = 1;
}

// 땅에 비치는 빛 (광원이 기둥에 가리면 약해진다)
function drawGroundGlow(lt, camX) {
  if (lt.weight <= 0.01) return;
  let open = 1;
  for (const p of pipes) {
    const x = p.wx - camX + heroX;
    const cov = clamp((Math.min(x + p.w, lt.x + lt.r) - Math.max(x, lt.x - lt.r)) / (lt.r * 2), 0, 1);
    open = Math.min(open, 1 - cov * 0.85);
  }
  ctx.save();
  ctx.beginPath(); ctx.rect(0, PLAY_H, VW, VH - PLAY_H); ctx.clip();
  ctx.translate(lt.x, PLAY_H);
  ctx.scale(1, 0.55);
  const R0 = 190;
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R0);
  g.addColorStop(0, 'rgba(' + csv(lt.core) + ',0.9)');
  g.addColorStop(0.25, 'rgba(' + csv(lt.rgb) + ',0.45)');
  g.addColorStop(1, 'rgba(' + csv(lt.rgb) + ',0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = lt.weight * lt.refl * open;
  ctx.fillStyle = g;
  ctx.fillRect(-R0, 0, R0 * 2, R0);
  ctx.restore();
}

function drawGround(sx, tintCol, tintA) {
  const y = PLAY_H;
  // 흙
  const off = ((sx % (DIRT_W * 2)) + DIRT_W * 2) % (DIRT_W * 2);
  for (let ty = y + 16; ty < VH; ty += DIRT_H * 2)
    for (let tx = -off; tx < VW; tx += DIRT_W * 2)
      ctx.drawImage(dirtImg, R(tx), ty, DIRT_W * 2 + 1 / S, DIRT_H * 2 + 1 / S);
  // 깊어질수록 어둡게 (세로로 긴 화면용)
  const depth = VH - y - 16;
  for (let i = 1; i <= 4; i++) {
    const dy = y + 16 + 34 * i * i * 0.5;
    if (dy >= VH) break;
    ctx.fillStyle = 'rgba(120,70,20,0.13)';
    ctx.fillRect(0, dy, VW, VH - dy);
  }
  // 잔디
  ctx.fillStyle = '#7ccf3f'; ctx.fillRect(0, y, VW, 16);
  ctx.fillStyle = '#a5e65a';
  const g = ((sx % 24) + 24) % 24;
  for (let x = -24 - g; x < VW + 24; x += 24)
    for (let k = 0; k < 6; k++) ctx.fillRect(R(x + k * 2), y + 2 + k * 2, 10, 2);
  ctx.fillStyle = '#c9f58a'; ctx.fillRect(0, y, VW, 2);
  ctx.fillStyle = '#4f9a2b'; ctx.fillRect(0, y + 14, VW, 2);
  ctx.fillStyle = '#b98f4a'; ctx.fillRect(0, y + 16, VW, 2);
  ctx.fillStyle = INK;       ctx.fillRect(0, y - 2, VW, 2);
  if (tintA > 0) {
    ctx.globalAlpha = tintA; ctx.fillStyle = tintCol;
    ctx.fillRect(0, y - 2, VW, VH - y + 2);
    ctx.globalAlpha = 1;
  }
}

function drawCape(g) {
  // 어깨에서 뒤로 흩날리는 망토 (2유닛 도트 기둥으로 그린다)
  const cols = 17;
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < cols; i++) {
      const x = 4 - i * 2;
      const wave = Math.sin(tick * 0.34 - i * 0.55) * i * 0.3 + Math.cos(tick * 0.21 - i * 0.3) * i * 0.12;
      const y = Math.round((-7 + wave) / 2) * 2;
      const th = i < 3 ? 6 : i > 13 ? 6 : 8;
      if (pass === 0) {
        g.fillStyle = INK;
        g.fillRect(x - (i === cols - 1 ? 2 : 0), y - 2, 2 + (i === cols - 1 ? 2 : 0), th + 4);
      } else {
        g.fillStyle = '#e8408f'; g.fillRect(x, y, 2, th);
        g.fillStyle = '#ff7ab8'; g.fillRect(x, y, 2, 2);
        g.fillStyle = '#a82468'; g.fillRect(x, y + th - 2, 2, 2);
      }
    }
  }
}
/* --- 주인공 조명 ---
   주인공(망토 포함)을 작은 버퍼에 먼저 그린 뒤 그 모양 안에서만 빛을 입힌다.
   1) 시간대 색(노을/밤)  2) 역광일수록 어두워지는 실루엣  3) 광원 쪽 가장자리의 림 라이트 */
const HB_W = 88, HB_H = 60, HB_CX = 52, HB_CY = 30;
const [heroCv, heroG] = makeCanvas(HB_W, HB_H);
const [rimCv, rimG] = makeCanvas(HB_W, HB_H);
let heroProx = 0;                      // 광원이 주인공 바로 뒤에 있는 정도 0~1
function buildHero(env, hy, hr) {
  const g = heroG, lt = env.light;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.clearRect(0, 0, HB_W, HB_H);
  g.setTransform(1, 0, 0, 1, HB_CX, HB_CY);
  drawCape(g);
  g.drawImage(heroSprite, -HERO_W / 2, -HERO_H / 2, HERO_W, HERO_H);
  g.setTransform(1, 0, 0, 1, 0, 0);

  g.globalCompositeOperation = 'source-atop';
  if (env.tintA > 0.004) {
    g.globalAlpha = env.tintA * 0.85; g.fillStyle = env.tintCol;
    g.fillRect(0, 0, HB_W, HB_H);
  }
  heroProx = 0;
  if (lt.weight > 0.01) {
    const dx = lt.x - heroX, dy = lt.y - hy, d = Math.hypot(dx, dy) || 1;
    const prox = smooth(clamp(1 - (d - 40) / 170, 0, 1));
    heroProx = prox * prox * lt.weight;
    // 역광: 빛을 등질수록 몸이 어둡게 가라앉는다
    g.globalAlpha = 0.42 * prox * prox * lt.weight * (lt.sun ? 1 : 0.7);
    g.fillStyle = lt.sun ? '#1a0e1c' : '#070a24';
    g.fillRect(0, 0, HB_W, HB_H);

    // 림 라이트: 광원 방향으로 한 칸 밀어 뺀 가장자리만 빛 색으로 칠한다
    const c = Math.cos(-hr), sn = Math.sin(-hr);
    const lx = (dx * c - dy * sn) / d, ly = (dx * sn + dy * c) / d;
    const ox = Math.abs(lx) > 0.38 ? -Math.sign(lx) * 2 : 0, oy = Math.abs(ly) > 0.38 ? -Math.sign(ly) * 2 : 0;
    const r = rimG;
    r.globalCompositeOperation = 'source-over'; r.globalAlpha = 1;
    r.clearRect(0, 0, HB_W, HB_H);
    r.drawImage(heroCv, 0, 0);
    r.globalCompositeOperation = 'destination-out';
    r.drawImage(heroCv, ox, oy);
    r.globalCompositeOperation = 'source-in';
    r.fillStyle = rgb(mix3(lt.rgb, lt.core, 0.6));
    r.fillRect(0, 0, HB_W, HB_H);
    g.globalCompositeOperation = 'source-atop';
    g.globalAlpha = clamp(lt.weight * (0.4 + 0.6 * prox) * (lt.sun ? 1 : 0.75), 0, 1);
    g.drawImage(rimCv, 0, 0);
  }
  if (fogF > 0.001) {
    g.globalCompositeOperation = 'source-atop';
    g.globalAlpha = fogF; g.fillStyle = '#000';
    g.fillRect(0, 0, HB_W, HB_H);
  }
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
}
function drawHero(y, rot) {
  ctx.save();
  ctx.translate(R(heroX), R(y));
  ctx.rotate(rot);
  ctx.drawImage(heroCv, -HB_CX, -HB_CY);
  ctx.restore();
}

/* --- 주인공 주변 빛줄기 ---
   해나 달이 주인공 뒤에 올 때, 주인공 주변만 2배 해상도로 다시 광산란을 계산한다.
   몸과 망토의 윤곽이 빛을 가르면서 실루엣 둘레로 빛줄기가 뻗어 나온다. */
const LR = 240, LG = 2, LN = LR * 2 / LG;
const [hOccCv, hOccG] = makeCanvas(LN, LN);
const [hBlurCv, hBlurG] = makeCanvas(LN, LN);
const [hRayCv, hRayG] = makeCanvas(LN, LN);
function drawHeroRays(lt, camX, hy, hr, sx) {
  const I = heroProx * Math.min(1, lt.k * 1.1);
  if (!fxRays || !(I >= 0.02)) return;
  const ox = heroX - LR, oy = hy - LR;
  const mod = (v, m) => ((v % m) + m) % m;

  let g = hOccG;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.clearRect(0, 0, LN, LN);
  g.setTransform(1 / LG, 0, 0, 1 / LG, -ox / LG, -oy / LG);
  const R1 = lt.r * 3.4;
  const grad = g.createRadialGradient(lt.x, lt.y, 0, lt.x, lt.y, R1);
  grad.addColorStop(0, 'rgba(' + csv(lt.core) + ',1)');
  grad.addColorStop(0.3, 'rgba(' + csv(lt.core) + ',1)');
  grad.addColorStop(0.55, 'rgba(' + csv(lt.rgb) + ',0.6)');
  grad.addColorStop(1, 'rgba(' + csv(lt.rgb) + ',0)');
  g.fillStyle = grad;
  g.fillRect(lt.x - R1, lt.y - R1, R1 * 2, R1 * 2);

  // 가리는 것들: 건물, 기둥, 그리고 주인공의 실제 윤곽(망토 포함)
  g.globalCompositeOperation = 'destination-out';
  g.imageSmoothingEnabled = true;
  const occLayer = (Ly, off, a) => {
    const w = Ly.W * 2, h = Ly.H * 2, y = PLAY_H - h + 2;
    if (y > oy + LR * 2) return;
    g.globalAlpha = a;
    for (let x = -mod(off, w); x < ox + LR * 2; x += w) if (x + w > ox) g.drawImage(Ly.imgs[0], x, y, w, h);
  };
  occLayer(FAR, sx * 0.18, 0.8);
  occLayer(NEAR, sx * 0.38, 1);
  g.globalAlpha = 1; g.fillStyle = '#000';
  g.fillRect(ox, PLAY_H, LR * 2, LR * 2);
  for (const p of pipes) {
    const x = p.wx - camX + heroX;
    if (x > ox + LR * 2 || x + p.w < ox) continue;
    const c = pipeCenter(p), top = c - p.gap / 2, bot = c + p.gap / 2;
    g.fillRect(x, oy - 10, p.w, top - CAP_H - oy + 10);
    g.fillRect(x - CAP_OVER, top - CAP_H, p.w + CAP_OVER * 2, CAP_H);
    g.fillRect(x - CAP_OVER, bot, p.w + CAP_OVER * 2, CAP_H);
    g.fillRect(x, bot + CAP_H, p.w, PLAY_H - bot - CAP_H + 10);
  }
  g.save();
  g.translate(heroX, hy); g.rotate(hr);
  g.drawImage(heroCv, -HB_CX, -HB_CY);
  g.restore();

  // 광원 중심 방사형 블러 (2단계)
  const cx = (lt.x - ox) / LG, cy = (lt.y - oy) / LG;
  g = hBlurG;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-over';
  g.clearRect(0, 0, LN, LN);
  g.globalCompositeOperation = 'lighter';
  g.imageSmoothingEnabled = true;
  g.globalAlpha = 1 / 8;
  for (let i = 0; i < 8; i++) {
    const k = 1 + i * 0.03;
    g.setTransform(k, 0, 0, k, cx * (1 - k), cy * (1 - k));
    g.drawImage(hOccCv, 0, 0);
  }
  g = hRayG;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-over';
  g.clearRect(0, 0, LN, LN);
  g.globalCompositeOperation = 'lighter';
  g.imageSmoothingEnabled = true;
  const N2 = 7, DEC = 0.84;
  let sum = 0;
  for (let j = 0; j < N2; j++) sum += Math.pow(DEC, j);
  for (let j = 0; j < N2; j++) {
    const k = Math.pow(1.24, j);
    g.globalAlpha = Math.min(1, 1.25 * Math.pow(DEC, j) / sum);
    g.setTransform(k, 0, 0, k, cx * (1 - k), cy * (1 - k));
    g.drawImage(hBlurCv, 0, 0);
  }
  // 버퍼 가장자리는 부드럽게 사라지게
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'destination-in';
  g.globalAlpha = 1;
  const fade = g.createRadialGradient(LN / 2, LN / 2, LN * 0.24, LN / 2, LN / 2, LN / 2);
  fade.addColorStop(0, 'rgba(0,0,0,1)'); fade.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = fade;
  g.fillRect(0, 0, LN, LN);

  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, VW, PLAY_H); ctx.clip();
  ctx.imageSmoothingEnabled = true;
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = I;
  ctx.drawImage(hRayCv, ox, oy, LR * 2, LR * 2);
  ctx.restore();
  ctx.imageSmoothingEnabled = false;
}

function text(str, x, y, size, fill, opt) {
  opt = opt || {};
  ctx.font = size + 'px ' + FONT;
  ctx.textAlign = opt.align || 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  const ow = opt.outline === undefined ? Math.max(4, size * 0.3) : opt.outline;
  if (ow > 0) {
    ctx.strokeStyle = INK; ctx.lineWidth = ow;
    if (opt.shadow !== false) ctx.strokeText(str, x, y + Math.max(2, size * 0.12));
    ctx.strokeText(str, x, y);
  }
  ctx.fillStyle = fill;
  ctx.fillText(str, x, y);
}

function muteRect() {
  const s = 30 * ui;
  return { x: VW - safe.r - s - 10, y: safe.t + 10, s };
}
function drawMute() {
  const r = muteRect(), k = r.s / 30;
  ctx.save();
  ctx.translate(r.x, r.y); ctx.scale(k, k);
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = INK; ctx.fillRect(0, 0, 30, 30);
  ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fillRect(2, 2, 26, 26);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(7, 12, 4, 6); ctx.fillRect(11, 10, 2, 10); ctx.fillRect(13, 8, 2, 14);
  if (muted) {
    ctx.fillStyle = '#ff5d6c';
    ctx.fillRect(18, 11, 2, 2); ctx.fillRect(22, 11, 2, 2); ctx.fillRect(20, 13, 2, 2); ctx.fillRect(18, 15, 2, 2); ctx.fillRect(22, 15, 2, 2);
  } else {
    ctx.fillRect(18, 12, 2, 6); ctx.fillRect(21, 9, 2, 12);
  }
  ctx.restore();
}

const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

const DIFF_BW = 68, DIFF_BH = 34;
function diffRects() {
  const bw = DIFF_BW * ui, bh = DIFF_BH * ui, gap = 5 * ui, total = bw * DIFFS.length + gap * (DIFFS.length - 1);
  const x0 = VW / 2 - total / 2, y = PLAY_H * 0.45 + 132 * ui;
  return DIFFS.map((d, i) => ({ x: x0 + i * (bw + gap), y, w: bw, h: bh }));
}

function drawUI() {
  const cx = VW / 2, top = safe.t;
  drawMute();

  if (state === 'PLAYING' || state === 'DYING') {
    const k = ui * (1 + scorePop * 0.28);
    ctx.save();
    ctx.translate(cx, top + 30 + 40 * ui); ctx.scale(k, k);
    text(String(score), 0, 0, 36, '#ffffff', { outline: 10 });
    ctx.restore();
    if (fog && state === 'PLAYING' && dist < fog.start + 120 && (tick >> 4) & 1) {
      ctx.save();
      ctx.translate(cx, top + 30 + 66 * ui); ctx.scale(ui, ui);
      text('FOG ZONE', 0, 0, 12, '#cfe0ff', { outline: 5 });
      ctx.restore();
    }
  }

  if (state === 'READY') {
    ctx.save();
    ctx.translate(cx, Math.max(top + 150 * ui, PLAY_H * 0.25)); ctx.scale(ui, ui);
    const bob = Math.round(Math.sin(tick * 0.05) * 3);
    text('FLAPPY', 0, -44 + bob, 30, '#ffffff', { outline: 10 });
    text('HERO', 0, 2 + bob, 42, '#ffd23f', { outline: 12 });
    text('BEST ' + bests[D.id], 0, 36, 12, '#bff4ff', { outline: 5 });
    ctx.restore();

    ctx.save();
    ctx.translate(cx, PLAY_H * 0.45 + 92 * ui); ctx.scale(ui, ui);
    if ((tick >> 5) & 1 || tick < 20) text(coarse ? 'TAP TO FLY' : 'CLICK / SPACE', 0, 0, 14, '#ffffff', { outline: 6 });
    ctx.restore();

    // 난이도 선택
    const rs = diffRects();
    ctx.save();
    ctx.translate(cx, rs[0].y - 10 * ui); ctx.scale(ui, ui);
    text('DIFFICULTY', 0, 0, 9, '#ffffff', { outline: 4 });
    ctx.restore();
    DIFFS.forEach((d, i) => {
      const r = rs[i], sel = i === diffIdx;
      ctx.save();
      ctx.translate(r.x, r.y - (sel ? 2 * ui : 0)); ctx.scale(ui, ui);
      ctx.fillStyle = 'rgba(27,21,48,0.35)'; ctx.fillRect(3, 5, DIFF_BW, DIFF_BH);
      ctx.fillStyle = INK; ctx.fillRect(0, 0, DIFF_BW, DIFF_BH);
      ctx.fillStyle = sel ? d.col : '#3a3458'; ctx.fillRect(3, 3, DIFF_BW - 6, DIFF_BH - 6);
      ctx.fillStyle = sel ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.1)'; ctx.fillRect(3, 3, DIFF_BW - 6, 3);
      ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(3, DIFF_BH - 7, DIFF_BW - 6, 4);
      text(d.name, DIFF_BW / 2, DIFF_BH / 2 + 5, 9, sel ? INK : '#aaa4c8', { outline: 0 });
      if (sel) { ctx.fillStyle = '#ffffff'; ctx.fillRect(DIFF_BW / 2 - 5, DIFF_BH + 5, 10, 2); ctx.fillRect(DIFF_BW / 2 - 3, DIFF_BH + 3, 6, 2); ctx.fillRect(DIFF_BW / 2 - 1, DIFF_BH + 1, 2, 2); }
      ctx.restore();
    });
  }

  if (state === 'OVER') {
    const t = clamp(overT / 18, 0, 1), e = 1 - (1 - t) * (1 - t);
    ctx.save();
    ctx.translate(cx, Math.min(VH * 0.44, PLAY_H * 0.5) + (1 - e) * 40); ctx.scale(ui, ui);
    ctx.globalAlpha = e;

    text('GAME OVER', 0, -92, 26, '#ff5d6c', { outline: 9 });

    // 결과 패널
    const pw = 280, ph = 152, px = -pw / 2, py = -70;
    ctx.fillStyle = 'rgba(27,21,48,0.35)'; ctx.fillRect(px + 4, py + 6, pw, ph);
    ctx.fillStyle = INK;       ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = '#f7ecc6'; ctx.fillRect(px + 4, py + 4, pw - 8, ph - 8);
    ctx.fillStyle = '#e3d19a'; ctx.fillRect(px + 4, py + ph - 12, pw - 8, 8);
    ctx.fillStyle = '#fffaf0'; ctx.fillRect(px + 4, py + 4, pw - 8, 4);

    const medal = MEDALS.find(m => score >= m.min);
    text('MEDAL', -78, py + 30, 10, '#c8742b', { outline: 0 });
    drawMedal(-78, py + 84, overT > 22 ? medal : null);
    text(overT > 22 && medal ? medal.name : '10+', -78, py + 130, 8, '#a8946a', { outline: 0 });

    text('SCORE', 122, py + 30, 10, '#c8742b', { outline: 0, align: 'right' });
    text(String(shownScore), 122, py + 62, 22, '#ffffff', { outline: 7, align: 'right' });
    text('BEST', 122, py + 92, 10, '#c8742b', { outline: 0, align: 'right' });
    text(String(bests[D.id]), 122, py + 124, 22, '#ffd23f', { outline: 7, align: 'right' });
    if (newBest && overT > 26) {
      ctx.fillStyle = INK;       ctx.fillRect(22, py + 78, 42, 18);
      ctx.fillStyle = '#ff5d6c'; ctx.fillRect(24, py + 80, 38, 14);
      text('NEW', 43, py + 92, 9, '#ffffff', { outline: 0 });
    }

    text(D.name, 0, py + ph + 20, 10, D.col, { outline: 5 });
    if (overT > RETRY_DELAY && ((overT >> 5) & 1) === 0)
      text(coarse ? 'TAP TO RETRY' : 'CLICK / SPACE', 0, py + ph + 50, 14, '#ffffff', { outline: 6 });
    ctx.restore();
  }

  if (paused) {
    ctx.fillStyle = 'rgba(27,21,48,0.55)';
    ctx.fillRect(0, 0, VW, VH);
    ctx.save();
    ctx.translate(cx, VH * 0.42); ctx.scale(ui, ui);
    text('PAUSED', 0, 0, 28, '#ffffff', { outline: 9 });
    text(coarse ? 'TAP TO RESUME' : 'CLICK / SPACE', 0, 36, 12, '#bff4ff', { outline: 5 });
    ctx.restore();
  }
}

function render(alpha) {
  const camX = lerp(prevDist, dist, alpha);
  const sx = lerp(prevScrollX, scrollX, alpha);
  const hy = lerp(hero.prevY, hero.y, alpha);
  const hr = lerp(hero.prevRot, hero.rot, alpha);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  fogF = fogAt(camX);
  const env = computeEnv();
  ctx.fillStyle = env.sky[0];
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let ox = 0, oy = 0;
  if (shake > 0) { ox = (Math.random() - 0.5) * shake; oy = (Math.random() - 0.5) * shake; }
  ctx.setTransform(S, 0, 0, S, Math.round(ox * S), Math.round(oy * S));
  ctx.imageSmoothingEnabled = false;

  buildHero(env, hy, hr);
  computeRays(env.light, camX, hy, hr, sx);
  drawSky(sx, env);

  // 장애물과 땅은 시간대에 맞춰 색을 덮는다
  drawPipes(camX, env.tintCol, env.tintA);
  blackPipes(camX, fogF);
  compositeRays(1);
  blackPipes(camX, fogF * 0.82);          // 기둥은 가장 앞이라 안개가 거의 끼지 않는다 → 가장 검다
  drawHeroRays(env.light, camX, hy, hr, sx);
  drawGround(sx, env.tintCol, env.tintA);
  if (fogF > 0.001) { ctx.globalAlpha = fogF; ctx.fillStyle = '#000'; ctx.fillRect(0, PLAY_H - 2, VW, VH - PLAY_H + 2); ctx.globalAlpha = 1; }
  drawGroundGlow(env.light, camX);

  // 잔상 / 스피드 라인 / 파티클
  for (const g of ghosts) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, g.a) * (1 - fogF);
    ctx.translate(R(g.x), R(g.y)); ctx.rotate(g.rot);
    ctx.drawImage(heroGhost, -HERO_W / 2, -HERO_H / 2, HERO_W, HERO_H);
    ctx.restore();
  }
  ctx.fillStyle = '#ffffff';
  for (const l of lines) {
    ctx.globalAlpha = Math.max(0, l.a) * (1 - fogF);
    ctx.fillRect(R(l.x - l.len), Math.round(l.y / 2) * 2, l.len, 2);
  }
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life * 1.4, 0, 1) * (1 - fogF * 0.9);
    ctx.fillStyle = p.color;
    ctx.fillRect(R(p.x), R(p.y), p.size, p.size);
  }
  ctx.globalAlpha = 1;

  drawHero(hy, hr);

  if (flash > 0) {
    ctx.globalAlpha = flash * 0.7; ctx.fillStyle = '#ffffff';
    ctx.fillRect(-20, -20, VW + 40, VH + 40);
    ctx.globalAlpha = 1;
  }

  ctx.setTransform(S, 0, 0, S, 0, 0);
  drawUI();
}

/* =========================================================================
   8. 입력
   ========================================================================= */
function action() {
  initAudio();
  if (paused) {
    paused = false;
    if (state === 'PLAYING') flap();
    return;
  }
  if (state === 'READY') { state = 'PLAYING'; flap(); }
  else if (state === 'PLAYING') flap();
  else if (state === 'OVER' && overT > RETRY_DELAY) resetGame();
}

window.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  const ux = e.clientX / scale, uy = e.clientY / scale, m = muteRect();
  if (ux >= m.x - 8 && ux <= m.x + m.s + 8 && uy >= m.y - 8 && uy <= m.y + m.s + 8) {
    initAudio(); setMuted(!muted);
    return;
  }
  if (state === 'READY' && !paused) {
    const rs = diffRects();
    for (let i = 0; i < rs.length; i++) {
      const r = rs[i];
      if (ux >= r.x - 3 && ux <= r.x + r.w + 3 && uy >= r.y - 8 && uy <= r.y + r.h + 10) { initAudio(); setDiff(i); return; }
    }
  }
  action();
}, { passive: false });
window.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
window.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('gesturestart', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') {
    e.preventDefault();
    if (!e.repeat) action();
  } else if (state === 'READY' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'KeyA' || e.code === 'KeyD')) {
    e.preventDefault(); initAudio();
    setDiff(clamp(diffIdx + (e.code === 'ArrowLeft' || e.code === 'KeyA' ? -1 : 1), 0, DIFFS.length - 1));
  } else if (state === 'READY' && /^Digit[1-4]$/.test(e.code)) {
    initAudio(); setDiff(+e.code.slice(5) - 1);
  } else if (e.code === 'KeyM') {
    initAudio(); setMuted(!muted);
  } else if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'PLAYING') {
    paused = !paused;
  }
});

// 앱 전환/탭 이동 시 자동 일시정지
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'PLAYING') paused = true;
});
window.addEventListener('blur', () => { if (state === 'PLAYING') paused = true; });

/* =========================================================================
   9. 메인 루프
   ========================================================================= */
let lastT = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = now - lastT;
  lastT = now;
  if (dt > 250 || dt < 0) dt = STEP_MS;
  slowMs = slowMs * 0.95 + dt * 0.05;
  if (++slowN > 45 && slowMs > 24 && quality < DPR_CAPS.length - 1 && !qualityLock) {
    quality++; slowN = 0; slowMs = 16.7;
    if (quality === DPR_CAPS.length - 1) fxRays = false;
    resize();
  }
  acc += dt;
  let n = 0;
  while (acc >= STEP_MS && n < 5) {
    if (!paused) step();
    acc -= STEP_MS; n++;
  }
  if (n === 5) acc = 0;
  render(paused ? 1 : acc / STEP_MS);
}

if (document.fonts && document.fonts.load) document.fonts.load('16px "Press Start 2P"').catch(() => {});
requestAnimationFrame(t => { lastT = t; frame(t); });

// 자동 테스트/디버그용 훅
window.__game = {
  get state() { return state; }, get score() { return score; },
  get hero() { return hero; }, get pipes() { return pipes; }, get dist() { return dist; },
  pipeCenter, action, get quality() { return quality; }, set rays(v) { fxRays = v; },
  rayLum() { const d = histCtx.getImageData(0, 0, histCv.width, histCv.height).data; let t = 0; for (let i = 0; i < d.length; i += 4) t += (d[i] + d[i + 1] + d[i + 2]) * d[i + 3] / 255; return t / (d.length / 4) / 3; },
  set autopilot(v) { autopilot = v; },
  sim(maxScore, maxSteps) { let k = 0; while (state === 'PLAYING' && score < maxScore && k < maxSteps) { step(); k++; } const dp = pipes.find(q => q.wx + q.w > dist - HIT_HW - 4); return { score, state, k, pat: dp ? dp.pt : '-', dp: dp ? { gap: dp.gap, amp: Math.round(dp.amp), w: dp.w, dc: dp.dc, tr: dp.tr, hy: Math.round(hero.y - pipeCenter(dp)) } : null }; },
  reset() { resetGame(); todFF = false; tod = 0; }, set qualityLock(v) { qualityLock = v; },
  tensionAt, shapeAt,
  setScore(n) { score = n; }, setDiff, startFog, get fog() { return fog; }, get fogF() { return fogF; }, gapFor, speedFor,
  get tod() { return tod; }, set tod(v) { tod = v; }, get diff() { return D.id; }
};
})();
</script>
